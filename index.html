/* =========================================================
   FIRESTORE SYNC HOOK
   Keeps a collection in sync in real-time across devices.
   Auto-seeds the collection with demo data on first run only.
   Exposes a setData(updater) that behaves like React's setState
   so existing page components (ReportsPage, PcMonitoringPage,
   PosMonitoringPage) don't need to change at all.
   ========================================================= */
function useFirestoreCollection(collectionName, seedData) {
  const [data, setDataState] = useState(seedData);
  const [ready, setReady] = useState(false);
  const [error, setError] = useState(null);
  const dataRef = useRef(seedData);
  useEffect(() => { dataRef.current = data; }, [data]);

  useEffect(() => {
    let unsub = () => {};
    let cancelled = false;

    // Safety net: never let the UI hang forever, even if Firestore never responds.
    const timeout = setTimeout(() => {
      if (!cancelled) {
        console.warn('Firestore (' + collectionName + ') took too long to respond. Showing local data instead.');
        setError('timeout');
        setReady(true);
      }
    }, 10000);

    (async () => {
      try {
        const metaRef = db.collection('_meta').doc(collectionName);
        const metaSnap = await metaRef.get();
        if (!cancelled && !metaSnap.exists) {
          // First time this collection has ever been touched — seed it once and
          // permanently mark it as seeded, so future full deletions by the user
          // are respected instead of being "refilled" with old demo data.
          const snap = await db.collection(collectionName).get();
          if (snap.empty) {
            const batch = db.batch();
            seedData.forEach(item => batch.set(db.collection(collectionName).doc(item.id), item));
            batch.set(metaRef, { seeded: true, seededAt: new Date().toISOString() });
            await batch.commit();
          } else {
            await metaRef.set({ seeded: true, seededAt: new Date().toISOString() });
          }
        } else if (!cancelled && collectionName === 'posInventory') {
          const snap = await db.collection(collectionName).get();
          if (snap.docs.some(d => !('section' in d.data()))) {
            // One-time migration: legacy POS Monitoring records (old CTR/Monitor Serial/BIR-MIN-TIN schema)
            // don't have a `section` field, so they no longer match the Department Store / Supermarket tabs.
            // Replace them with the current schema so counts and tables stay accurate.
            const delBatch = db.batch();
            snap.docs.forEach(d => delBatch.delete(d.ref));
            await delBatch.commit();
            const addBatch = db.batch();
            seedData.forEach(item => addBatch.set(db.collection(collectionName).doc(item.id), item));
            await addBatch.commit();
          }
        } else if (!cancelled && collectionName === 'rrs') {
          const snap = await db.collection(collectionName).get();
          if (snap.docs.some(d => !('scopeOfWork' in d.data()))) {
            // One-time migration: legacy RRS records (old PC Name/Mobo/User/Request/Problem/CET schema)
            // are replaced with the current Date/RRS#/Department/Scope of Work/Quantity/Description/Complaints/
            // CET/Date Install/Status schema used on the form.
            const delBatch = db.batch();
            snap.docs.forEach(d => delBatch.delete(d.ref));
            await delBatch.commit();
            const addBatch = db.batch();
            seedData.forEach(item => addBatch.set(db.collection(collectionName).doc(item.id), item));
            await addBatch.commit();
          }
        } else if (!cancelled && collectionName === 'inventory') {
          // One-time migration: rename existing Inventory location labels only.
          // "Main Office" (old) -> "Storage Server", "Server" (old) -> "Main Office".
          // Only the location field is touched; itemName/quantity/remarks/date/id stay exactly as encoded.
          const renameMetaRef = db.collection('_meta').doc('inventoryLocRename_v1');
          const renameSnap = await renameMetaRef.get();
          if (!renameSnap.exists) {
            const snap = await db.collection(collectionName).get();
            const batch = db.batch();
            let changed = false;
            snap.docs.forEach(d => {
              const loc = d.data().location;
              if (loc === 'Main Office') { batch.update(d.ref, { location: 'Storage Server' }); changed = true; }
              else if (loc === 'Server') { batch.update(d.ref, { location: 'Main Office' }); changed = true; }
            });
            if (changed) await batch.commit();
            await renameMetaRef.set({ renamed: true, renamedAt: new Date().toISOString() });
          }
        }
        unsub = db.collection(collectionName).onSnapshot(
          snapshot => {
            const rows = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
            setDataState(rows);
            setError(null);
            setReady(true);
            clearTimeout(timeout);
          },
          err => {
            console.error('Firestore sync error (' + collectionName + '):', err);
            setError(err.code || err.message || 'sync-error');
            setReady(true);
            clearTimeout(timeout);
          }
        );
      } catch (err) {
        console.error('Firestore connection error (' + collectionName + '):', err);
        setError(err.code || err.message || 'connection-error');
        setReady(true);
        clearTimeout(timeout);
      }
    })();

    return () => { cancelled = true; clearTimeout(timeout); unsub(); };
  }, [collectionName]);

  function trackWrite(promise) {
    window.__pendingFirestoreWrites += 1;
    promise.finally(() => { window.__pendingFirestoreWrites = Math.max(0, window.__pendingFirestoreWrites - 1); });
    return promise;
  }

  function setData(updater) {
    const prev = dataRef.current;
    const next = typeof updater === 'function' ? updater(prev) : updater;
    const nextIds = new Set(next.map(r => r.id));
    prev.forEach(r => {
      if (!nextIds.has(r.id)) trackWrite(db.collection(collectionName).doc(r.id).delete()).catch(err => console.error('Delete failed:', err));
    });
    next.forEach(r => {
      const old = prev.find(p => p.id === r.id);
      if (!old || JSON.stringify(old) !== JSON.stringify(r)) {
        trackWrite(db.collection(collectionName).doc(r.id).set(r)).catch(err => console.error('Save failed:', err));
      }
    });
  }

  return [data, setData, ready, error];
}

/* =========================================================
   BACKUP SETTINGS (Admin)
   Settings live in Firestore doc _meta/backupSettings; the server-side Cloud Function
   (functions/index.js) reads them, runs the daily backup, and writes the result to
   _meta/backupStatus. This page only edits settings and displays status — the browser
   never performs the backup, so it runs even when the site/PC is closed.
   ========================================================= */
const BACKUP_DEFAULT_TZ = 'Asia/Manila';
function bkTzParts(ms, tz) {
  const p = {};
  new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false })
    .formatToParts(new Date(ms)).forEach(x => { p[x.type] = x.value; });
  return { y: +p.year, mo: +p.month, d: +p.day, h: (+p.hour) % 24, mi: +p.minute, key: `${p.year}-${p.month}-${p.day}` };
}
function bkZonedToUtc(y, mo, d, h, mi, tz) {
  const guess = Date.UTC(y, mo - 1, d, h, mi);
  const t = bkTzParts(guess, tz);
  return guess - (Date.UTC(t.y, t.mo - 1, t.d, t.h, t.mi) - guess);
}
function bkNextRun(settings, status) {
  if (!settings || settings.enabled !== true) return null;
  const tz = settings.timezone || BACKUP_DEFAULT_TZ;
  const [h, m] = String(settings.time || '02:00').split(':').map(Number);
  const now = Date.now();
  const t = bkTzParts(now, tz);
  const today = bkZonedToUtc(t.y, t.mo, t.d, h, m, tz);
  if (status && status.lastSuccessDate === t.key) return { at: bkZonedToUtc(t.y, t.mo, t.d + 1, h, m, tz), due: false };
  if (now < today) return { at: today, due: false };
  return { at: today, due: true };
}
function bkFmt(ms, tz) {
  return new Date(ms).toLocaleString('en-US', { timeZone: tz, month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
}

function BackupSettingsPage({ addToast }) {
  const [settings, setSettings] = useState(null);
  const [status, setStatus] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [form, setForm] = useState({ enabled: false, time: '02:00' });
  const [dirty, setDirty] = useState(false);
  const [saving, setSaving] = useState(false);
  const [, tick] = useState(0);
  const dirtyRef = useRef(false);
  useEffect(() => { dirtyRef.current = dirty; }, [dirty]);

  useEffect(() => {
    const u1 = db.doc('_meta/backupSettings').onSnapshot(snap => {
      const d = snap.exists ? snap.data() : {};
      setSettings(d);
      if (!dirtyRef.current) setForm({ enabled: d.enabled === true, time: d.time || '02:00' });
      setLoaded(true);
    }, () => setLoaded(true));
    const u2 = db.doc('_meta/backupStatus').onSnapshot(snap => setStatus(snap.exists ? snap.data() : {}), () => setStatus({}));
    const t = setInterval(() => tick(n => n + 1), 60000);
    return () => { u1(); u2(); clearInterval(t); };
  }, []);

  async function save() {
    if (!/^\d{2}:\d{2}$/.test(form.time)) { addToast('Please choose a valid backup time.', 'danger'); return; }
    setSaving(true);
    try {
      await db.doc('_meta/backupSettings').set({
        enabled: form.enabled, time: form.time,
        timezone: (settings && settings.timezone) || BACKUP_DEFAULT_TZ,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }, { merge: true });
      setDirty(false);
      addToast(form.enabled ? 'Daily backup enabled at ' + form.time : 'Automatic backup disabled', 'success');
    } catch (err) {
      console.error('Save backup settings failed:', err);
      addToast('Could not save backup settings. Check your connection.', 'danger');
    } finally { setSaving(false); }
  }

  async function runNow() {
    try {
      await db.doc('_meta/backupSettings').set({ runNowRequestedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      addToast('Backup requested — the server will run it within about 5 minutes.', 'success');
    } catch (err) { addToast('Could not request a backup.', 'danger'); }
  }

  if (!loaded || status === null) return <div className="meta">Loading backup settings…</div>;

  const tz = (settings && settings.timezone) || BACKUP_DEFAULT_TZ;
  const lastMs = status.lastSuccessAt ? status.lastSuccessAt.toMillis() : null;
  const next = bkNextRun(settings, status);
  const running = status.status === 'Running' && status.runningSince && Date.now() - status.runningSince.toMillis() < 15 * 60 * 1000;
  const shown = running ? 'Running' : (status.status === 'Success' || status.status === 'Failed') ? status.status : 'Not run yet';
  const pill = { Success: ['var(--green-bg)', 'var(--green-text)', 'var(--green)'], Failed: ['var(--red-bg)', 'var(--red-text)', 'var(--red)'],
    Running: ['var(--blue-bg)', 'var(--blue-text)', 'var(--blue)'], 'Not run yet': ['var(--gray-bg)', 'var(--gray-text)', '#94A3B8'] }[shown];
  const row = (label, value) => (
    <div style={{ display: 'flex', justifyContent: 'space-between', gap: '16px', padding: '10px 0', borderBottom: '1px solid var(--border, #E5E7EB)', fontSize: '13.5px' }}>
      <span style={{ color: 'var(--text-muted)' }}>{label}</span><span style={{ fontWeight: 600, textAlign: 'right' }}>{value}</span>
    </div>
  );

  return (
    <div style={{ display: 'grid', gap: '18px', maxWidth: '760px' }}>
      <SectionPanel variant="pc" icon="clock" title="Daily Automatic Backup" subtitle="Runs on Google's servers every day — even when this website and your PC are closed.">
        <div className="form-grid">
          <Field label="Automatic backup">
            <label style={{ display: 'flex', alignItems: 'center', gap: '10px', cursor: 'pointer', fontSize: '14px' }}>
              <input type="checkbox" checked={form.enabled} onChange={e => { setForm(f => ({ ...f, enabled: e.target.checked })); setDirty(true); }} style={{ width: '18px', height: '18px' }} />
              {form.enabled ? 'Enabled' : 'Disabled'}
            </label>
          </Field>
          <Field label={'Daily backup time (' + tz + ')'}>
            <input className="input" type="time" value={form.time} onChange={e => { setForm(f => ({ ...f, time: e.target.value })); setDirty(true); }} />
          </Field>
        </div>
        <div className="form-actions" style={{ justifyContent: 'flex-start', gap: '10px' }}>
          <button className="btn btn-primary" onClick={save} disabled={saving || !dirty}>{saving ? 'Saving…' : 'Save Settings'}</button>
          <button className="btn btn-secondary" onClick={runNow} title="Asks the server to back up now (starts within ~5 minutes)">Run Backup Now</button>
        </div>
      </SectionPanel>

      <SectionPanel variant="pc" icon="box" title="Backup Status" subtitle="Everything is saved to a single file that is replaced on every successful backup.">
        {row('Status', <span className="badge" style={{ background: pill[0], color: pill[1] }}><span className="bdot" style={{ background: pill[2] }}></span>{shown}</span>)}
        {row('Last successful backup', lastMs ? bkFmt(lastMs, tz) : 'None yet')}
        {row('Next scheduled backup', !next ? 'Automatic backup is disabled' : next.due ? 'Due now — starts within ~5 minutes' : bkFmt(next.at, tz))}
        {row('Backup file', (status.fileName || 'ISS_Daily_Backup.json') + ' (replaced each time)')}
        {status.totalDocuments != null && row('Last backup contents', status.totalDocuments + ' records in ' + status.totalCollections + ' collections' + (status.sizeBytes ? ' · ' + Math.max(1, Math.round(status.sizeBytes / 1024)) + ' KB' : ''))}
        {status.status === 'Failed' && (
          <p style={{ marginTop: '12px', fontSize: '12.5px', color: 'var(--red-text)', background: 'var(--red-bg)', padding: '10px 12px', borderRadius: '9px' }}>
            Last attempt failed{status.lastFailureAt ? ' (' + bkFmt(status.lastFailureAt.toMillis(), tz) + ')' : ''}: {status.message || 'unknown error'}. The previous backup file was left untouched; the server retries automatically.
          </p>
        )}
      </SectionPanel>
    </div>
  );
}

const PAGES_META = {
  dashboard: { title: 'Dashboard', subtitle: 'Monitoring overview across PC & Selling Area operations', icon: 'dashboard' },
  pcReports: { title: 'Back Office Reports', subtitle: 'Trouble reports for back-office & admin department computers', icon: 'pc' },

  replacements: { title: 'Replacement', subtitle: 'Item replacement tracking for Back Office & Selling Area', icon: 'repeat' },
  rrs: { title: 'RRS', subtitle: 'Repair Request Slip records for Back Office units', icon: 'clipboard' },

  const [transmittals, setTransmittals, transmittalsReady, transmittalsErr] = useFirestoreCollection('transmittals', SEED_TRANSMITTALS);
  const [idfFloors, setIdfFloors, idfFloorsReady, idfFloorsErr] = useFirestoreCollection('idfFloors', SEED_IDF_FLOORS);

  const allReady = idfFloorsReady && idfsReady && pcReportsReady && saReportsReady && pcInventoryReady && posInventoryReady && ghlReportsReady && ghlTerminalsReady && inventoryReady && physicalCountReady && replacementsReady && rrsReady && mrsDepartmentReady && transmittalsReady;
  const connectionError = idfFloorsErr || idfsErr || pcReportsErr || saReportsErr || pcInventoryErr || posInventoryErr || ghlReportsErr || ghlTerminalsErr || inventoryErr || physicalCountErr || replacementsErr || rrsErr || mrsDepartmentErr || transmittalsErr;

  const [backupBusy, setBackupBusy] = useState(false);
  const [autoBackupMinutes, setAutoBackupMinutes] = useState(0);
  const [backupFormat, setBackupFormat] = useState('pdf');
  const [lastBackupAt, setLastBackupAt] = useState(null);
  const errorBackupFiredRef = useRef(false);
  const [deferredInstallPrompt, setDeferredInstallPrompt] = useState(null);
  const [showInstallHelp, setShowInstallHelp] = useState(false);
  const [pendingWrites, setPendingWrites] = useState(0);
  const [wipeModalOpen, setWipeModalOpen] = useState(false);
  const [wipeBusy, setWipeBusy] = useState(false);
  const footerClickRef = useRef({ count: 0, timer: null });

  function handleHiddenFooterClick() {
    const ref = footerClickRef.current;
    ref.count += 1;
    if (ref.timer) clearTimeout(ref.timer);
    ref.timer = setTimeout(() => { ref.count = 0; }, 2000);
    if (ref.count >= 5) {
      ref.count = 0;
      setWipeModalOpen(true);
    }
  }

  async function handleConfirmWipeAll() {
    setWipeBusy(true);
    try {
      await wipeAllStarterData();
      addToast('All data cleared. Starting fresh — nothing will be re-added automatically.', 'success');
      setWipeModalOpen(false);
    } catch (err) {
      console.error('Wipe all data failed:', err);
      addToast('Failed to clear data — check your internet connection and try again.', 'danger');
    } finally {
      setWipeBusy(false);
    }
  }

  useEffect(() => {
    const t = setInterval(() => {
      setPendingWrites(window.__pendingFirestoreWrites || 0);
    }, 300);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    function onBeforeInstallPrompt(e) {
      e.preventDefault();
      setDeferredInstallPrompt(e);
    }
    window.addEventListener('beforeinstallprompt', onBeforeInstallPrompt);
    return () => window.removeEventListener('beforeinstallprompt', onBeforeInstallPrompt);
  }, []);

  async function handleInstallClick() {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      try { await deferredInstallPrompt.userChoice; } catch (e) {}
      setDeferredInstallPrompt(null);
    } else {
      setShowInstallHelp(true);
    }
  }

  const [pcQuery, setPcQuery] = useState('');
  const [saQuery, setSaQuery] = useState('');
  const [pcInvQuery, setPcInvQuery] = useState('');
  const [posInvQuery, setPosInvQuery] = useState('');
  const [ghlQuery, setGhlQuery] = useState('');
  const [invQuery, setInvQuery] = useState('');
  const [physQuery, setPhysQuery] = useState('');
  const [replQuery, setReplQuery] = useState('');
  const [rrsQuery, setRrsQuery] = useState('');
  const [mrsQuery, setMrsQuery] = useState('');
  const [transmittalQuery, setTransmittalQuery] = useState('');

  useEffect(() => {
    const t = setInterval(() => setClock(new Date()), 30000);
    return () => clearInterval(t);
  }, []);

  function addToast(message, type = 'success') {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, message, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }

  function runBackup(silent, format) {
    const fmt = format || backupFormat;
    setBackupBusy(true);
    try {
      const collections = { pcReports, saReports, pcInventory, posInventory, ghlReports, ghlTerminals, inventory, physicalCount, replacements, rrs, mrsDepartment, transmittals };
      const labels = [];
      if (fmt === 'pdf' || fmt === 'both') { generateBackupPdf(collections); labels.push('PDF'); }
      if (fmt === 'excel' || fmt === 'both') { generateBackupExcel(collections); labels.push('Excel'); }
      setLastBackupAt(new Date());
      const what = labels.join(' & ');
      addToast(silent ? `Auto-backup ${what} downloaded` : `Backup ${what} downloaded successfully`, 'success');
    } catch (err) {
      console.error('Backup failed:', err);
      addToast('Backup failed — a required library did not load. Check your internet connection.', 'danger');
    } finally {
      setBackupBusy(false);
    }
  }

  useEffect(() => {
    if (!autoBackupMinutes) return;
    const t = setInterval(() => runBackup(true), autoBackupMinutes * 60 * 1000);
    return () => clearInterval(t);
  }, [autoBackupMinutes, backupFormat, pcReports, saReports, pcInventory, posInventory, ghlReports, ghlTerminals, inventory, physicalCount, replacements]);

  useEffect(() => {
    if (connectionError && !errorBackupFiredRef.current && allReady) {
      errorBackupFiredRef.current = true;
      runBackup(true);
    }
  }, [connectionError, allReady]);

  const invLocCounts = useMemo(() => {
    const m = {};
    INVENTORY_LOCATIONS.forEach(l => { m[l] = 0; });
    inventory.forEach(r => { if (m[r.location] !== undefined) m[r.location] += 1; });
    return m;
  }, [inventory]);

  const physCatCounts = useMemo(() => {
    const m = {};
    PHYSICAL_COUNT_CATEGORIES.forEach(c => { m[c] = 0; });
    physicalCount.forEach(r => { if (m[r.category] !== undefined) m[r.category] += 1; });
    return m;
  }, [physicalCount]);

  const currentPageMeta = page === 'inventory'
    ? { title: 'Inventory — ' + invLoc, subtitle: `Stock records for ${invLoc}`, icon: 'box' }
    : page === 'physicalCount'
    ? { title: 'Physical Inventory Count — ' + physCat, subtitle: `Stock records for ${physCat}`, icon: 'box' }
    : PAGES_META[page];

  let searchProps = { show: false, query: '', setQuery: () => {}, placeholder: '' };
  if (page === 'pcReports') searchProps = { show: true, query: pcQuery, setQuery: setPcQuery, placeholder: 'Search PC reports (problem, dept, technician)...' };
  if (page === 'saReports') searchProps = { show: true, query: saQuery, setQuery: setSaQuery, placeholder: 'Search by counter, terminal, issue, or technician...' };
  if (page === 'pcMonitoring') searchProps = { show: true, query: pcInvQuery, setQuery: setPcInvQuery, placeholder: 'Search by PC Name, IP Address, or Department...' };
  if (page === 'posMonitoring') searchProps = { show: true, query: posInvQuery, setQuery: setPosInvQuery, placeholder: 'Search POS terminals, counter, serials...' };
  if (page === 'ghlReports') searchProps = { show: true, query: ghlQuery, setQuery: setGhlQuery, placeholder: 'Search GHL reports (counter, type, SN, request #)...' };
  if (page === 'inventory') searchProps = { show: true, query: invQuery, setQuery: setInvQuery, placeholder: 'Search item name or remarks...' };
  if (page === 'physicalCount') searchProps = { show: true, query: physQuery, setQuery: setPhysQuery, placeholder: 'Search serial number or remarks...' };
  if (page === 'replacements') searchProps = { show: true, query: replQuery, setQuery: setReplQuery, placeholder: 'Search by department, PC name, item name, or status...' };
  if (page === 'rrs') searchProps = { show: true, query: rrsQuery, setQuery: setRrsQuery, placeholder: 'Search by RRS #, department, scope of work, or CET...' };
  if (page === 'mrsDepartment') searchProps = { show: true, query: mrsQuery, setQuery: setMrsQuery, placeholder: 'Search by description, department, or received by...' };
  if (page === 'transmittal') searchProps = { show: true, query: transmittalQuery, setQuery: setTransmittalQuery, placeholder: 'Search by transmittal #, from, to, description, CET, or status...' };

  if (!allReady) {
    return (
      <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '10px', background: 'var(--canvas)' }}>
        <div className="status-pill" style={{ color: 'var(--accent-dark)' }}><span className="pulse"></span></div>
        <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: '12.5px', color: 'var(--text-muted)' }}>Connecting to database...</div>
      </div>
    );
  }

  return (
    <div className="app-shell">
      {connectionError && (
        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, zIndex: 300, background: 'var(--red)', color: '#fff', fontSize: '12.5px', textAlign: 'center', padding: '8px 14px' }}>

        </div>
      )}
      <div className={"overlay" + (sidebarOpen ? " show" : "")} onClick={() => setSidebarOpen(false)}></div>
      <Sidebar

        activeLoc={invLoc}
        activePhysCat={physCat}
        onSelect={(k) => {
          if (k.indexOf('inventory:') === 0) {

            setPage('inventory');
          } else if (k.indexOf('physicalCount:') === 0) {
            setPhysCat(k.slice('physicalCount:'.length));
            setPage('physicalCount');
          } else {
            setPage(k);
          }
          setSidebarOpen(false);
        }}
        open={sidebarOpen}
        pcCount={pcInventory.length}
        posCount={posInventory.length}
        locCounts={invLocCounts}
        physCatCounts={physCatCounts}
        onBackupNow={() => runBackup(false)}
        onInstallClick={handleInstallClick}
        backupBusy={backupBusy}
        autoBackupMinutes={autoBackupMinutes}
        onAutoBackupChange={(mins) => { setAutoBackupMinutes(mins); addToast(mins ? `Auto-backup enabled — every ${mins} min` : 'Auto-backup disabled', 'success'); }}
        lastBackupAt={lastBackupAt}
        backupFormat={backupFormat}
        onBackupFormatChange={setBackupFormat}
        pendingWrites={pendingWrites}
        onHiddenFooterClick={handleHiddenFooterClick}
      />
      <div className="main">
        <Header
          current={currentPageMeta}
          onMenu={() => setSidebarOpen(o => !o)}
          clock={clock}
          query={searchProps.query}
          setQuery={searchProps.setQuery}
          searchPlaceholder={searchProps.placeholder}
          showSearch={searchProps.show}
        />
        <div className="ticker">
          <div className="ticker-track">
            <span className="tick-item"><span className="dot" style={{ background: 'var(--accent)' }}></span>{pcReports.length} Back Office Reports</span>
            <span className="tick-item"><span className="dot" style={{ background: 'var(--accent-2)' }}></span>{saReports.length} Selling Area Reports</span>
            <span className="tick-item"><span className="dot" style={{ background: '#7C3AED' }}></span>{pcInventory.length} Back Office Devices</span>
            <span className="tick-item"><span className="dot" style={{ background: '#EA580C' }}></span>{posInventory.length} Selling Area Devices</span>
            <span className="tick-item"><span className="dot" style={{ background: '#0D9488' }}></span>{ghlReports.length} NTT Reports</span>
            <span className="tick-item"><span className="dot" style={{ background: '#DB2777' }}></span>{inventory.length} Inventory by Location</span>
            <span className="tick-item"><span className="dot" style={{ background: '#F59E0B' }}></span>{physicalCount.length} Physical Inventory Count</span>
            <span className="tick-item"><span className="dot" style={{ background: '#8B5CF6' }}></span>{replacements.length} Replacement Records</span>
            <span className="tick-item"><span className="dot" style={{ background: '#2563EB' }}></span>{rrs.length} RRS Records</span>
            <span className="tick-item"><span className="dot" style={{ background: '#16A34A' }}></span>{mrsDepartment.length} MSRS Department Records</span>
            <span className="tick-item"><span className="dot" style={{ background: '#EA580C' }}></span>{transmittals.length} Transmittal Records</span>
            <span className="tick-item muted">Last sync {clock.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</span>

            <span className="tick-item" aria-hidden="true"><span className="dot" style={{ background: 'var(--accent-2)' }}></span>{saReports.length} Selling Area Reports</span>
            <span className="tick-item" aria-hidden="true"><span className="dot" style={{ background: '#7C3AED' }}></span>{pcInventory.length} Back Office Devices</span>
            <span className="tick-item" aria-hidden="true"><span className="dot" style={{ background: '#EA580C' }}></span>{posInventory.length} Selling Area Devices</span>
            <span className="tick-item" aria-hidden="true"><span className="dot" style={{ background: '#0D9488' }}></span>{ghlReports.length} NTT Reports</span>
            <span className="tick-item" aria-hidden="true"><span className="dot" style={{ background: '#DB2777' }}></span>{inventory.length} Inventory by Location</span>
            <span className="tick-item" aria-hidden="true"><span className="dot" style={{ background: '#F59E0B' }}></span>{physicalCount.length} Physical Inventory Count</span>
            <span className="tick-item" aria-hidden="true"><span className="dot" style={{ background: '#8B5CF6' }}></span>{replacements.length} Replacement Records</span>
            <span className="tick-item" aria-hidden="true"><span className="dot" style={{ background: '#2563EB' }}></span>{rrs.length} RRS Records</span>
            <span className="tick-item" aria-hidden="true"><span className="dot" style={{ background: '#16A34A' }}></span>{mrsDepartment.length} MSRS Department Records</span>
            <span className="tick-item" aria-hidden="true"><span className="dot" style={{ background: '#EA580C' }}></span>{transmittals.length} Transmittal Records</span>
            <span className="tick-item muted" aria-hidden="true">Last sync {clock.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</span>
          </div>
        </div>
        <div className="content">
          {page === 'dashboard' && <Dashboard pcReports={pcReports} saReports={saReports} pcInventory={pcInventory} posInventory={posInventory} />}
          {page === 'pcReports' && (
            <ReportsPage titleLabel="PC Report" idPrefix="PCR" data={pcReports} setData={setPcReports} departmentOptions={DEPARTMENTS} addToast={addToast} query={pcQuery} setQuery={setPcQuery} />
          )}
          {page === 'saReports' && (
            <SaReportsPage data={saReports} setData={setSaReports} departmentOptions={SELLING_AREAS} addToast={addToast} query={saQuery} setQuery={setSaQuery} />
          )}
          {page === 'pcMonitoring' && (
            <PcMonitoringPage data={pcInventory} setData={setPcInventory} addToast={addToast} query={pcInvQuery} setQuery={setPcInvQuery} />
          )}
          {page === 'posMonitoring' && (
            <PosMonitoringPage data={posInventory} setData={setPosInventory} addToast={addToast} query={posInvQuery} setQuery={setPosInvQuery} />
          )}
          {page === 'ghlReports' && (
            <GhlReportsPage data={ghlReports} setData={setGhlReports} terminals={ghlTerminals} setTerminals={setGhlTerminals} addToast={addToast} query={ghlQuery} setQuery={setGhlQuery} />
          )}
          {page === 'inventory' && (
            <InventoryPage data={inventory} setData={setInventory} addToast={addToast} query={invQuery} setQuery={setInvQuery} activeLoc={invLoc} setActiveLoc={setInvLoc} />
          )}
          {page === 'physicalCount' && (
            <PhysicalCountPage data={physicalCount} setData={setPhysicalCount} addToast={addToast} query={physQuery} setQuery={setPhysQuery} activeCategory={physCat} setActiveCategory={setPhysCat} />
          )}
          {page === 'replacements' && (
            <ReplacementsPage data={replacements} setData={setReplacements} addToast={addToast} query={replQuery} setQuery={setReplQuery} />
          )}
          {page === 'rrs' && (
            <RrsPage data={rrs} setData={setRrs} addToast={addToast} query={rrsQuery} setQuery={setRrsQuery} />
          )}
          {page === 'mrsDepartment' && (
            <MrsDepartmentPage data={mrsDepartment} setData={setMrsDepartment} addToast={addToast} query={mrsQuery} setQuery={setMrsQuery} />
          )}
          {page === 'idfRack' && (
            <IdfRackPage floors={idfFloors} setFloors={setIdfFloors} idfs={idfs} setIdfs={setIdfs} addToast={addToast} />
          )}
          {page === 'backupSettings' && <BackupSettingsPage addToast={addToast} />}
          {page === 'transmittal' && (
            <TransmittalPage data={transmittals} setData={setTransmittals} addToast={addToast} query={transmittalQuery} setQuery={setTransmittalQuery} />
          )}
        </div>
      </div>
      <ToastContainer toasts={toasts} />
      {showInstallHelp && <InstallHelpModal onClose={() => setShowInstallHelp(false)} />}
      {wipeModalOpen && (
        <WipeAllDataModal
          busy={wipeBusy}
          onCancel={() => { if (!wipeBusy) setWipeModalOpen(false); }}
          onConfirm={handleConfirmWipeAll}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker registration failed:', err));
    });
  }
</script>

<!-- Click-to-enlarge: tap any data cell in any section/table to pop it up in large text. Read-only, doesn't touch any data. -->
<script>
(function(){
  function buildOverlay(){
    var overlay = document.createElement('div');
    overlay.id = 'cellDetailOverlay';
    overlay.className = 'modal-overlay';
    overlay.style.display = 'none';
    overlay.innerHTML =
      '<div class="cell-detail-modal">' +
        '<div class="modal-head">' +
          '<h3 id="cellDetailLabel">Details</h3>' +
          '<button type="button" class="modal-close" id="cellDetailClose" aria-label="Close">&times;</button>' +
        '</div>' +
        '<div class="cell-detail-body">' +
          '<div id="cellDetailValue"></div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('mousedown', function(e){
      if (e.target === overlay) hideCellDetail();
    });
    document.getElementById('cellDetailClose').addEventListener('click', hideCellDetail);
    return overlay;
  }

  function getOverlay(){
    return document.getElementById('cellDetailOverlay') || buildOverlay();
  }

  function showRowDetail(table, rowEl){
    var overlay = getOverlay();
    var theadRow = table.querySelector('thead tr');
    var headers = theadRow ? Array.prototype.map.call(theadRow.children, function (th) {
      return th.textContent.trim();
    }) : [];

    var valueEl = document.getElementById('cellDetailValue');
    valueEl.innerHTML = '';

    var cells = Array.prototype.slice.call(rowEl.children);
    var addedAny = false;
    cells.forEach(function (td, i) {
      // Skip the actions column (edit/delete buttons) - there's no data to read there.
      if (td.querySelector('button, a, input, select, textarea')) return;

      var label = headers[i] || '';
      var text = (td.getAttribute('title') || td.textContent || '').trim();
      if (!label && !text) return;

      var row = document.createElement('div');
      row.className = 'cell-detail-row';

      var lab = document.createElement('div');
      lab.className = 'cell-detail-row-label';
      lab.textContent = label || ' ';

      var val = document.createElement('div');
      val.className = 'cell-detail-row-value' + (td.classList.contains('mono') ? ' mono' : '');
      val.textContent = text || '—';

      row.appendChild(lab);
      row.appendChild(val);
      valueEl.appendChild(row);
      addedAny = true;
    });

    if (!addedAny) return;

    document.getElementById('cellDetailLabel').textContent = 'Record Details';
    overlay.style.display = 'flex';
  }

  function hideCellDetail(){
    var overlay = document.getElementById('cellDetailOverlay');
    if (overlay) overlay.style.display = 'none';
  }

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') hideCellDetail();
  });

  document.addEventListener('click', function(e){
    var td = e.target.closest('td');
    if (!td) return;
    if (!td.closest('.table-wrap')) return;
    // Clicking the actions column (edit/delete buttons) should not trigger the popup.
    if (td.querySelector('button, a, input, select, textarea')) return;

    var table = td.closest('table');
    var rowEl = td.parentElement;
    showRowDetail(table, rowEl);
  });
})();
</script>
</body>
