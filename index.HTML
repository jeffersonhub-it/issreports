<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ISS Department Monitoring System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1220;
    --ink-2:#151F35;
    --ink-3:#1E2A44;
    --ink-border:#26314A;
    --accent:#2DD4BF;
    --accent-dark:#0D9488;
    --accent-soft:#CCFBF1;
    --accent-2:#3B82F6;
    --accent-2-dark:#1D4ED8;
    --accent-2-soft:#DBEAFE;
    --canvas:#EEF2F7;
    --surface:#FFFFFF;
    --border:#E2E8F0;
    --text:#0F172A;
    --text-muted:#64748B;
    --text-faint:#94A3B8;
    --green:#16A34A;--green-bg:#DCFCE7;--green-text:#166534;
    --amber:#D97706;--amber-bg:#FEF3C7;--amber-text:#92400E;
    --blue:#2563EB;--blue-bg:#DBEAFE;--blue-text:#1E40AF;
    --violet:#7C3AED;--violet-bg:#EDE9FE;--violet-text:#5B21B6;
    --red:#DC2626;--red-bg:#FEE2E2;--red-text:#991B1B;
    --orange:#EA580C;--orange-bg:#FFEDD5;--orange-text:#9A3412;
    --gray-bg:#F1F5F9;--gray-text:#475569;
    --radius:12px;
    --radius-sm:8px;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 6px 16px rgba(15,23,42,.06);
    --shadow-md:0 4px 10px rgba(15,23,42,.06), 0 10px 24px rgba(15,23,42,.08);
    --shadow-lg:0 20px 60px rgba(2,6,23,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--canvas);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--accent-soft);}
  button:focus-visible,.nav-item:focus-visible,.icon-btn:focus-visible,.page-btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}
  a{color:var(--accent-2-dark);}

  /* ---------- layout ---------- */
  .app-shell{display:flex;min-height:100vh;}
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:39;display:none;}
  .main{flex:1;display:flex;flex-direction:column;min-height:100vh;margin-left:264px;min-width:0;}

  /* ---------- sidebar ---------- */
  .sidebar{
    width:264px;background:var(--ink);color:#CBD5E1;position:fixed;top:0;left:0;bottom:0;
    display:flex;flex-direction:column;z-index:40;border-right:1px solid var(--ink-border);
  }
  .sidebar-brand{padding:22px 20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ink-border);}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;color:#04120F;font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:15px;flex:none;
  }
  .brand-text h2{color:#fff;font-size:15px;line-height:1.2;}
  .brand-text span{font-size:11px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;}
  .sidebar-nav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent;}
  .sidebar-nav::-webkit-scrollbar{width:5px;}
  .sidebar-nav::-webkit-scrollbar-track{background:transparent;}
  .sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:20px;}
  .sidebar-nav::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.32);}
  .nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);padding:10px 12px 6px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;border:none;background:transparent;width:100%;
    color:#B7C2D6;text-align:left;font-size:13.5px;font-weight:500;position:relative;transition:background .15s,color .15s;
  }
  .nav-item .nav-ic{display:flex;color:#7C8AA8;transition:color .15s;}
  .nav-item:hover{background:var(--ink-2);color:#fff;}
  .nav-item:hover .nav-ic{color:var(--accent);}
  .nav-item.active{background:var(--ink-3);color:#fff;}
  .nav-item.active .nav-ic{color:var(--accent);}
  .nav-item.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent);}
  .nav-item-badge{margin-left:auto;font-size:10.5px;font-family:'IBM Plex Mono',monospace;background:var(--ink-2);color:var(--text-faint);padding:2px 7px;border-radius:20px;}
  .sidebar-footer{padding:16px 20px;border-top:1px solid var(--ink-border);}
  .status-pill{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8DF0D8;}
  .status-pill .pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(45,212,191,.6);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(45,212,191,.55);}70%{box-shadow:0 0 0 7px rgba(45,212,191,0);}100%{box-shadow:0 0 0 0 rgba(45,212,191,0);}}
  .sidebar-footer .meta{margin-top:6px;font-size:10.5px;color:var(--text-faint);}

  /* ---------- header ---------- */
  .header{
    background:var(--surface);border-bottom:1px solid var(--border);padding:14px 26px;
    display:flex;align-items:center;justify-content:space-between;gap:18px;position:sticky;top:0;z-index:20;flex-wrap:wrap;
  }
  .header-left{display:flex;align-items:center;gap:14px;min-width:0;}
  .menu-btn{display:none;background:var(--gray-bg);border:none;border-radius:8px;padding:8px;color:var(--text);}
  .header-icon{width:38px;height:38px;border-radius:10px;background:var(--ink);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;}
  .header-title-wrap{display:flex;align-items:center;gap:12px;min-width:0;}
  .header h1{font-size:18px;color:var(--text);white-space:nowrap;}
  .header p{margin:1px 0 0;font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .header-search{width:280px;}
  .clock-chip,.user-chip{
    display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);background:var(--gray-bg);
    padding:7px 11px;border-radius:20px;white-space:nowrap;font-family:'IBM Plex Mono',monospace;
  }
  .user-chip{font-family:'Inter',sans-serif;font-weight:600;color:var(--text);}

  /* ---------- ticker ---------- */
  .ticker{
    background:var(--ink);color:#CBD5E1;padding:7px 0;display:flex;align-items:center;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;white-space:nowrap;overflow:hidden;position:relative;
  }
  .ticker-track{display:flex;gap:22px;align-items:center;flex:none;padding-left:26px;animation:tickerScroll 26s linear infinite;}
  .ticker:hover .ticker-track{animation-play-state:paused;}
  @keyframes tickerScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .tick-item{display:flex;align-items:center;gap:7px;color:#D6DEEC;flex:none;}
  .tick-item .dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .tick-item.muted{color:var(--text-faint);}

  /* ---------- content ---------- */
  .content{padding:24px 26px 60px;flex:1;min-width:0;}

  /* ---------- generic components ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);transition:box-shadow .15s,border-color .15s;}
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
  .kpi-card{padding:18px 20px;display:flex;flex-direction:column;gap:10px;}
  .kpi-card:hover{box-shadow:var(--shadow-md);border-color:#D7DEE8;}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;}
  .kpi-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
  .kpi-value{font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:700;color:var(--text);line-height:1.1;}
  .kpi-label{font-size:12.5px;color:var(--text-muted);font-weight:500;}

  .panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .panel-head-bar{height:4px;width:100%;background:var(--accent);}
  .panel.sa .panel-head-bar{background:var(--accent-2);}
  .panel-body{padding:20px 22px 22px;}
  .panel-title-row{display:flex;align-items:center;gap:11px;margin-bottom:2px;}
  .panel-ic{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;flex:none;}
  .panel.sa .panel-ic{background:var(--accent-2-soft);color:var(--accent-2-dark);}
  .panel-title-row h3{font-size:15.5px;}
  .panel-sub{font-size:12px;color:var(--text-muted);margin:2px 0 16px 43px;}

  .mini-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
  .mini-kpi{background:var(--gray-bg);border-radius:9px;padding:11px 13px;}
  .mini-kpi .mv{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .mini-kpi .ml{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .trend-up{color:var(--green);}
  .trend-down{color:var(--red);}
  .trend-flat{color:var(--text-muted);}

  .chart-row{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start;}
  .chart-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:10px;font-weight:600;}
  .chart-col{min-width:0;}
  .donut-col{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .legend{display:flex;flex-direction:column;gap:6px;width:100%;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .legend-row .sw{width:9px;height:9px;border-radius:2px;flex:none;}
  .legend-row .lv{margin-left:auto;font-weight:600;color:var(--text);font-family:'IBM Plex Mono',monospace;}

  .recent-card{padding:0;margin-bottom:6px;}
  .card-header{padding:16px 22px;border-bottom:1px solid var(--border);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;}
  .recent-row{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--border);font-size:13px;transition:background .15s;}
  .recent-row:hover{background:#FAFBFD;}
  .recent-row:last-child{border-bottom:none;}
  .recent-tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;font-family:'IBM Plex Mono',monospace;flex:none;}
  .recent-tag.pc{background:var(--accent-soft);color:var(--accent-dark);}
  .recent-tag.sa{background:var(--accent-2-soft);color:var(--accent-2-dark);}
  .recent-dept{font-weight:600;flex:none;width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .recent-problem{color:var(--text-muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .recent-date{color:var(--text-faint);font-family:'IBM Plex Mono',monospace;font-size:11.5px;flex:none;}

  /* ---------- toolbar / table ---------- */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);}
  .toolbar .select{min-width:170px;}
  .input-wrap{position:relative;display:flex;align-items:center;}
  .input-wrap .ic-search{position:absolute;left:11px;color:var(--text-faint);pointer-events:none;}
  .input-wrap input{padding:9px 12px 9px 34px;width:100%;}
  .input,.select,.textarea{
    border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;background:#fff;color:var(--text);
    outline:none;transition:border-color .15s, box-shadow .15s;
  }
  .input:hover,.select:hover,.textarea:hover{border-color:#CBD5E1;}
  .input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .textarea{resize:vertical;width:100%;font-family:inherit;}
  .select{
    min-width:150px;appearance:none;-webkit-appearance:none;padding-right:32px;cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center;
  }
  .header-search input{border-color:var(--border);}

  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:600;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s,box-shadow .15s;}
  .btn-primary{background:var(--ink);color:#fff;box-shadow:0 1px 2px rgba(11,18,32,.15);}
  .btn-primary:hover{background:var(--ink-3);}
  .btn-secondary{background:#fff;color:var(--text);border-color:var(--border);}
  .btn-secondary:hover{background:var(--gray-bg);border-color:#CBD5E1;}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-danger:hover{background:#B91C1C;}
  .confirm-actions .btn-danger:focus{outline:3px solid #B91C1C;outline-offset:2px;box-shadow:0 0 0 4px rgba(220,38,38,.22);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .table-card{padding:0;}
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:1080px;}
  table.table-compact{min-width:680px;}

  /* ---------- inventory location tabs ---------- */
  .loc-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .loc-tab{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:600;color:var(--text-muted);transition:background .15s,border-color .15s,color .15s;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);}
  .loc-tab:hover{border-color:#CBD5E1;color:var(--text);}
  .loc-tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .loc-tab .loc-count{font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--gray-bg);color:var(--text-muted);padding:1px 7px;border-radius:20px;}
  .loc-tab.active .loc-count{background:rgba(255,255,255,.16);color:#fff;}
  thead th{
    text-align:left;padding:12px 16px;background:#F8FAFC;border-bottom:1px solid var(--border);
    font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);
    cursor:pointer;user-select:none;white-space:nowrap;font-weight:700;position:sticky;top:0;z-index:1;
  }
  thead th:hover{color:var(--text);background:#F1F5F9;}
  thead th:last-child{cursor:default;}
  thead th:last-child:hover{color:var(--text-muted);background:#F8FAFC;}
  .th-inner{display:inline-flex;align-items:center;gap:5px;}
  tbody td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text);line-height:1.4;}
  tbody tr:nth-child(even) td{background:#FBFCFE;}
  tbody tr:hover td{background:var(--accent-soft);}
  tbody tr:last-child td{border-bottom:none;}
  .truncate{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .truncate-sm{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cell-sub{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .empty-row{text-align:center;color:var(--text-faint);padding:44px 16px !important;font-size:13px;}
  .empty-state{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .empty-state .empty-ic{width:36px;height:36px;border-radius:10px;background:var(--gray-bg);color:var(--text-faint);display:flex;align-items:center;justify-content:center;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{background:var(--gray-bg);border:none;border-radius:7px;padding:6px;color:var(--text-muted);display:flex;transition:background .15s,color .15s;}
  .icon-btn:hover{background:var(--accent-dark);color:#fff;}
  .icon-btn.danger:hover{background:var(--red);color:#fff;}

  .pagination{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-top:1px solid var(--border);flex-wrap:wrap;gap:10px;}
  .pagination .info{font-size:12px;color:var(--text-muted);}
  .pagination .controls{display:flex;gap:6px;align-items:center;}
  .page-btn{border:1px solid var(--border);background:#fff;border-radius:7px;padding:6px 11px;font-size:12.5px;color:var(--text);transition:background .15s,border-color .15s;}
  .page-btn:hover:not(:disabled):not(.current){background:var(--gray-bg);border-color:#CBD5E1;}
  .page-btn:disabled{opacity:.4;cursor:not-allowed;}
  .page-btn.current{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* ---------- badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .badge .bdot{width:6px;height:6px;border-radius:50%;flex:none;}
  .status-select{
    appearance:none;-webkit-appearance:none;border:1px solid transparent;border-radius:999px;
    padding:4px 26px 4px 10px;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;
    background-repeat:no-repeat;background-position:right 8px center;background-size:11px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23334155' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    transition:box-shadow .15s,border-color .15s;
  }
  .status-select:hover{border-color:rgba(15,23,42,.18);}
  .status-select:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-2-soft);}

  /* ---------- modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(2,6,23,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:#fff;border-radius:16px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;}
  .modal-head h3{font-size:16.5px;}
  .modal-close{background:var(--gray-bg);border:none;border-radius:8px;padding:7px;color:var(--text-muted);}
  .modal-close:hover{background:var(--red-bg);color:var(--red);}
  .modal-body{padding:20px 22px 22px;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .field-full{grid-column:1/-1;}
  .field label{font-size:12px;font-weight:600;color:var(--text-muted);}
  .field .req{color:var(--red);margin-left:3px;}
  .key-field{display:flex;gap:6px;align-items:center;}
  .key-field .input{flex:1;min-width:0;}
  .form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;margin-top:6px;padding-top:14px;border-top:1px solid var(--border);}
  .form-section-label{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--text-faint);margin:4px 0 -4px;}
  .form-section-label:first-child{margin-top:0;}

  /* ---------- confirm dialog ---------- */
  .confirm-box{max-width:400px;padding:24px;text-align:left;}
  .confirm-icon{width:44px;height:44px;border-radius:12px;background:var(--red-bg);color:var(--red);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .confirm-box h3{font-size:16px;margin-bottom:8px;}
  .confirm-box p{font-size:13.5px;color:var(--text-muted);line-height:1.5;margin:0 0 20px;}
  .confirm-actions{display:flex;justify-content:flex-end;gap:10px;}

  /* ---------- toast ---------- */
  .toast-wrap{position:fixed;bottom:22px;right:22px;left:22px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:200;pointer-events:none;}
  .toast{
    background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:500;
    box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;min-width:230px;max-width:100%;animation:toastIn .2s ease;border-left:3px solid var(--accent);pointer-events:auto;

/* =========================================================
   HELPERS
   ========================================================= */
function formatDate(d) {
  const dt = new Date(d + 'T00:00:00');
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
}
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function monthKey(d) { const dt = new Date(d + 'T00:00:00'); return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0'); }
function monthLabelFromKey(k) { const [y, m] = k.split('-'); return MONTHS[parseInt(m, 10) - 1]; }
function computeMonthlySeries(data, refDate, dateKey = 'dateReported') {
  const keys = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(refDate.getFullYear(), refDate.getMonth() - i, 1);
    keys.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
  }
  return keys.map(k => ({ month: monthLabelFromKey(k), value: data.filter(r => monthKey(r[dateKey]) === k).length }));
}
function trendPct(curr, prev) {
  if (prev === 0 && curr === 0) return { label: '0%', dir: 'flat' };
  if (prev === 0) return { label: '+100%', dir: 'up' };
  const pct = Math.round(((curr - prev) / prev) * 100);
  return { label: (pct >= 0 ? '+' : '') + pct + '%', dir: pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat' };
}
function statusCounts(data, statuses) {
  const colorFor = s => (STATUS_STYLES[s] || {}).dot || '#94A3B8';
  return statuses.map(s => ({ label: s, value: data.filter(r => r.status === s).length, color: colorFor(s) })).filter(x => x.value > 0);
}

/* =========================================================
   PDF BACKUP GENERATOR
   Builds a single PDF containing every data section, so the
   raw records survive even if the web app / database breaks.
   ========================================================= */
function pdfCell(v) {
  if (v === undefined || v === null || v === '') return '-';
  return String(v);
}

function buildBackupSections(collections) {
  return [
    { title: 'Back Office Reports', columns: REPORT_COLUMNS, rows: collections.pcReports },
    { title: 'Selling Area Reports', columns: SA_REPORT_COLUMNS, rows: collections.saReports },
    { title: 'NTT Reports', columns: GHL_COLUMNS, rows: collections.ghlReports },
    { title: 'NTT Terminal Registry', columns: [['ctr','CTR'],['terminal','Terminal'],['serialNumber','Serial Number']], rows: collections.ghlTerminals },
    { title: 'Back Office — Device & Specifications', columns: [
        ['department','Department'],['deviceType','Device Type'],['pcName','PC Name'],['user','User'],['ipAddress','IP Address'],['macAddress','MAC Address'],
        ['windowsVersion','Windows Version'],['motherboardModel','Motherboard Model'],['motherboardSN','Motherboard SN'],
        ['ramModel','RAM Model'],['ramSN','RAM SN'],['storageModel','Storage Model'],['storageType','Storage Type'],
        ['printerModel','Printer Model'],['printer','Printer SN'],['monitorModel','Monitor Model'],['monitor','Monitor SN'],
        ['scannerModel','Scanner Model'],['scannerSN','Scanner SN'],['processor','Processor'],['gpu','GPU'],['projector','Projector'],['status','Status'],
      ], rows: collections.pcInventory },
    { title: 'Selling Area — Device & Specifications', columns: [
        ['section','Section'],['counter','Counter'],['terminal','Terminal'],['serial','Serial'],
        ['display1','1st Display SN'],['display2','2nd Display SN'],['printerSerial','Printer SN'],
        ['scannerSerial','Scanner SN'],['flatbedSerial','Flatbed/Vertical SN'],['ghlSerial','NTT Terminal SN'],['status','Status'],
      ], rows: collections.posInventory },
    { title: 'Inventory by Location', columns: [['location','Location'],['date','Date'],['itemName','Item Name'],['quantity','Quantity'],['remarks','Remarks']], rows: collections.inventory },
  ];
}

function backupFilenameBase(now) {
  return 'ISS_Backup_' + now.toISOString().slice(0, 10) + '_' + now.toTimeString().slice(0, 8).replace(/:/g, '');
}

function generateBackupPdf(collections) {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    throw new Error('PDF library not loaded');
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  const now = new Date();
  const stamp = now.toLocaleString('en-US', { month: 'short', day: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });

  const sections = buildBackupSections(collections);

  // Cover page
  doc.setFontSize(20);
  doc.text('ISS Department Monitoring System', 40, 60);
  doc.setFontSize(13);
  doc.text('Full Data Backup', 40, 84);
  doc.setFontSize(10);
  doc.setTextColor(100);
  doc.text('Generated: ' + stamp, 40, 104);
  doc.setTextColor(20);
  doc.setFontSize(11);
  let y = 140;
  doc.text('Contents:', 40, y);
  y += 18;
  sections.forEach(s => {
    doc.text('- ' + s.title + '  (' + s.rows.length + ' record' + (s.rows.length === 1 ? '' : 's') + ')', 56, y);
    y += 16;
  });
  doc.setFontSize(9);
  doc.setTextColor(120);
  doc.text('This file is a local backup snapshot for recovery purposes. Keep it somewhere safe.', 40, y + 14);
  doc.setTextColor(20);

  sections.forEach(sec => {
    doc.addPage();
    doc.setFontSize(13);
    doc.text(sec.title, 30, 32);
    doc.setFontSize(9);
    doc.setTextColor(120);
    doc.text(sec.rows.length + ' record' + (sec.rows.length === 1 ? '' : 's'), 30, 46);
    doc.setTextColor(20);
    doc.autoTable({
      startY: 56,
      margin: { left: 20, right: 20 },
      styles: { fontSize: 6.5, cellPadding: 3, overflow: 'linebreak' },
      headStyles: { fillColor: [11, 18, 32], textColor: 255 },
      alternateRowStyles: { fillColor: [248, 250, 252] },
      head: [sec.columns.map(c => c[1])],
      body: sec.rows.map(r => sec.columns.map(c => pdfCell(r[c[0]]))),
    });
  });

  const filename = backupFilenameBase(now) + '.pdf';
  doc.save(filename);
  return filename;
}

function generateBackupExcel(collections) {
  if (!window.XLSX) {
    throw new Error('Excel library not loaded');
  }
  const now = new Date();
  const sections = buildBackupSections(collections);
  const wb = XLSX.utils.book_new();

  // Cover / summary sheet
  const summaryRows = [
    ['ISS Department Monitoring System'],
    ['Full Data Backup'],
    ['Generated: ' + now.toLocaleString('en-US', { month: 'short', day: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' })],
    [],
    ['Contents', 'Records'],
  ];
  sections.forEach(s => summaryRows.push([s.title, s.rows.length]));
  const summarySheet = XLSX.utils.aoa_to_sheet(summaryRows);
  summarySheet['!cols'] = [{ wch: 38 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, summarySheet, 'Summary');

  // One sheet per section
  const usedNames = {};
  sections.forEach(sec => {
    const header = sec.columns.map(c => c[1]);
    const rows = sec.rows.map(r => sec.columns.map(c => {
      const v = r[c[0]];
      return (v === undefined || v === null) ? '' : v;
    }));
    const sheet = XLSX.utils.aoa_to_sheet([header, ...rows]);
    sheet['!cols'] = sec.columns.map(() => ({ wch: 18 }));
    let name = sec.title.replace(/[\\/*?:\[\]]/g, '').slice(0, 31) || 'Sheet';
    if (usedNames[name]) {
      usedNames[name] += 1;
      name = (name.slice(0, 28) + ' ' + usedNames[name]).slice(0, 31);
    } else {
      usedNames[name] = 1;
    }
    XLSX.utils.book_append_sheet(wb, sheet, name);
  });

  const filename = backupFilenameBase(now) + '.xlsx';
  XLSX.writeFile(wb, filename);
  return filename;
}

function StatusSelect({ status, options, onChange }) {
  const st = STATUS_STYLES[status] || { bg: 'var(--gray-bg)', text: 'var(--gray-text)', dot: '#94A3B8' };
  return (
    <select
      className="status-select"
      value={status}
      onChange={e => onChange(e.target.value)}
      style={{ background: st.bg, color: st.text }}
      title="Click to update status"
    >
      {options.map(s => <option key={s} value={s}>{s}</option>)}
    </select>
  );
}

function SearchInput({ value, onChange, placeholder, className = '' }) {
  return (
    <div className={"input-wrap " + className}>
      <span className="ic-search"><Icon name="search" size={15} /></span>
      <input className="input" style={{ width: '100%' }} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} />
    </div>
  );
}

function Modal({ title, onClose, children, maxWidth = '620px' }) {
  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape') onClose(); }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  return (
    <div className="modal-overlay" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" style={{ maxWidth }}>
        <div className="modal-head">
          <h3>{title}</h3>
          <button className="modal-close" onClick={onClose}><Icon name="x" size={16} /></button>
        </div>
        <div className="modal-body">{children}</div>
      </div>
    </div>
  );
}

function ConfirmDialog({ message, onCancel, onConfirm, title = "Delete record?" }) {
  const deleteBtnRef = useRef(null);
  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape') onCancel(); }
    window.addEventListener('keydown', onKey);
    deleteBtnRef.current && deleteBtnRef.current.focus();
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  return (
    <div className="modal-overlay" onMouseDown={e => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="modal confirm-box">
        <div className="confirm-icon"><Icon name="alert" size={22} /></div>
        <h3>{title}</h3>
        <p>{message}</p>
        <div className="confirm-actions">
          <button className="btn btn-secondary" onClick={onCancel}>Cancel</button>
          <button ref={deleteBtnRef} className="btn btn-danger" onClick={onConfirm}><Icon name="trash" size={14} /> Delete</button>
        </div>

    </div>
  );
}

function ToastContainer({ toasts }) {
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div key={t.id} className={"toast " + t.type}>
          <Icon name={t.type === 'danger' ? 'trash' : 'check'} size={15} />
          {t.message}
        </div>
      ))}
    </div>
  );
}

function Field({ label, children, full, required }) {
  return (
    <div className={"field" + (full ? " field-full" : "")}>
      <label>{label}{required && <span className="req">*</span>}</label>
      {children}
    </div>
  );
}

function Pagination({ page, totalPages, onChange, total, pageSize }) {
  const start = total === 0 ? 0 : (page - 1) * pageSize + 1;
  const end = Math.min(page * pageSize, total);
  return (
    <div className="pagination">
      <div className="info">Showing <strong>{start}-{end}</strong> of <strong>{total}</strong> records</div>
      <div className="controls">
        <button className="page-btn" disabled={page <= 1} onClick={() => onChange(page - 1)}>Prev</button>
        <span className="page-btn current">{page} / {totalPages}</span>
        <button className="page-btn" disabled={page >= totalPages} onClick={() => onChange(page + 1)}>Next</button>
      </div>
    </div>
  );
}

function SortableTh({ label, sortKey, currentKey, dir, onSort }) {
  const icon = currentKey === sortKey ? (dir === 'asc' ? 'chevronUp' : 'chevronDown') : 'chevronsUpDown';
  return <th onClick={() => onSort(sortKey)}><span className="th-inner">{label} <Icon name={icon} size={12} /></span></th>;
}

/* =========================================================
   CHARTS (custom SVG, no external chart library)
   ========================================================= */
function BarTrendChart({ data, color }) {
  const max = Math.max(...data.map(d => d.value), 1);
  const w = 340, h = 160, padBottom = 26, padTop = 16;
  const gap = w / data.length;
  const barWidth = gap * 0.46;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: '100%', height: 'auto', display: 'block' }}>
      <line x1="0" y1={h - padBottom} x2={w} y2={h - padBottom} stroke="#E2E8F0" strokeWidth="1" />
      {data.map((d, i) => {
        const barH = ((h - padBottom - padTop) * d.value) / max;
        const x = i * gap + (gap - barWidth) / 2;
        const y = h - padBottom - barH;
        const isLast = i === data.length - 1;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barWidth} height={Math.max(barH, 1)} rx="4" fill={color} opacity={isLast ? 1 : 0.42} />
            <text x={x + barWidth / 2} y={h - padBottom + 15} textAnchor="middle" fontSize="9.5" fill="#64748B" fontFamily="'IBM Plex Mono',monospace">{d.month}</text>
            {d.value > 0 && <text x={x + barWidth / 2} y={y - 5} textAnchor="middle" fontSize="10.5" fontWeight="700" fill="#0F172A" fontFamily="'Space Grotesk',sans-serif">{d.value}</text>}
          </g>
        );
      })}
    </svg>
  );
}

function DonutChart({ data, size = 128, strokeWidth = 18 }) {
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  let acc = 0;
  if (data.length === 0) {
    return (
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="#E2E8F0" strokeWidth={strokeWidth} />
        <text x="50%" y="50%" textAnchor="middle" dominantBaseline="middle" fontSize="13" fill="#94A3B8" fontFamily="'Inter',sans-serif">No data</text>
      </svg>
    );
  }
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <g transform={`rotate(-90 ${size / 2} ${size / 2})`}>
        {data.map((d, i) => {
          const frac = d.value / total;
          const dash = frac * circumference;
          const el = (
            <circle key={i} cx={size / 2} cy={size / 2} r={radius} fill="none" stroke={d.color} strokeWidth={strokeWidth}
              strokeDasharray={`${dash} ${circumference - dash}`} strokeDashoffset={-acc} strokeLinecap="butt" />
          );
          acc += dash;
          return el;
        })}
      </g>
      <text x="50%" y="47%" textAnchor="middle" dominantBaseline="middle" fontSize="21" fontWeight="700" fill="#0F172A" fontFamily="'Space Grotesk',sans-serif">{total}</text>
      <text x="50%" y="63%" textAnchor="middle" dominantBaseline="middle" fontSize="9.5" fill="#94A3B8" fontFamily="'Inter',sans-serif">reports</text>
    </svg>
  );
}

function Legend({ data }) {
  return (
    <div className="legend">
      {data.map((d, i) => (
        <div className="legend-row" key={i}>
          <span className="sw" style={{ background: d.color }}></span>
          <span>{d.label}</span>
          <span className="lv">{d.value}</span>
        </div>
      ))}
    </div>
  );
}

/* =========================================================
   DASHBOARD
   ========================================================= */
function Dashboard({ pcReports, saReports, pcInventory, posInventory }) {
  const now = new Date();
  const pcSeries = useMemo(() => computeMonthlySeries(pcReports, now), [pcReports]);
  const pcThisMonth = pcSeries[pcSeries.length - 1].value;
  const pcLastMonth = pcSeries[pcSeries.length - 2].value;
  const pcTrend = trendPct(pcThisMonth, pcLastMonth);
  const pcStatusData = useMemo(() => statusCounts(pcReports, REPORT_STATUSES), [pcReports]);
  const saStatusData = useMemo(() => statusCounts(saReports, REPORT_STATUSES), [saReports]);
  const saSeries = useMemo(() => computeMonthlySeries(saReports, now, 'date'), [saReports]);
  const saThisMonth = saSeries[saSeries.length - 1].value;
  const saLastMonth = saSeries[saSeries.length - 2].value;
  const saTrend = trendPct(saThisMonth, saLastMonth);
  const saResolvedCount = useMemo(() => saReports.filter(r => r.status === 'Completed').length, [saReports]);
  const saAttentionCount = useMemo(() => saReports.filter(r => r.status === 'Pending' || r.status === 'In Progress').length, [saReports]);

  const recent = useMemo(() => {
    const combined = pcReports.map(r => ({ ...r, kind: 'pc' }));
    combined.sort((a, b) => new Date(b.dateReported) - new Date(a.dateReported));
    return combined.slice(0, 6);
  }, [pcReports]);

  // System Unit Count KPI: cycles Total -> Micro PC -> System Unit -> Total
  const [pcModeIdx, setPcModeIdx] = useState(0);
  const pcModes = useMemo(() => ([
    { label: 'System Unit Count', value: pcInventory.length },
    { label: 'Micro PC', value: pcInventory.filter(p => p.deviceType === 'Micro PC').length },
    { label: 'System Unit', value: pcInventory.filter(p => p.deviceType === 'System Unit').length },
  ]), [pcInventory]);
  const pcMode = pcModes[pcModeIdx % pcModes.length];

  // POS Count KPI: cycles Total -> SP -> DS -> Total
  const [posModeIdx, setPosModeIdx] = useState(0);
  const posModes = useMemo(() => ([
    { label: 'POS Count', value: posInventory.length },
    { label: 'SP', value: posInventory.filter(p => p.section === 'Supermarket').length },
    { label: 'DS', value: posInventory.filter(p => p.section === 'Department Store').length },
  ]), [posInventory]);
  const posMode = posModes[posModeIdx % posModes.length];

  return (
    <div>
      <div className="kpi-row">
        <KpiCard icon="pc" label="Total PC Reports" value={pcReports.length} accentBg="var(--accent-soft)" accentColor="var(--accent-dark)" />
        <KpiCard icon="store" label="Selling Area Reports" value={saReports.length} accentBg="var(--accent-2-soft)" accentColor="var(--accent-2-dark)" />
        <KpiCard icon="server" label={pcMode.label} value={pcMode.value} accentBg="var(--violet-bg)" accentColor="var(--violet-text)" onIconClick={() => setPcModeIdx(i => i + 1)} />
        <KpiCard icon="pos" label={posMode.label} value={posMode.value} accentBg="var(--orange-bg)" accentColor="var(--orange-text)" onIconClick={() => setPosModeIdx(i => i + 1)} />
      </div>

      <div className="panel-grid">
        <SectionPanel variant="pc" icon="pc" title="Back Office Reports" subtitle="Trouble reports logged for back-office & admin department computers">
          <div className="mini-kpi-row">
            <MiniKpi label="Total Reports" value={pcReports.length} />
            <MiniKpi label="This Month" value={pcThisMonth} />
            <MiniKpi label="Monthly Trend" value={pcTrend.label} trendDir={pcTrend.dir} />
          </div>
          <div className="chart-row">
            <div className="chart-col">
              <div className="chart-title">Monthly Report Volume</div>
              <BarTrendChart data={pcSeries} color="var(--accent-dark)" />
            </div>
            <div className="chart-col donut-col">
              <div className="chart-title">Status Breakdown</div>
              <DonutChart data={pcStatusData} />
              <Legend data={pcStatusData} />
            </div>
          </div>
        </SectionPanel>

        <SectionPanel variant="sa" icon="store" title="Selling Area Reports" subtitle="Trouble reports for supermarket & department store counters and terminals">
          <div className="mini-kpi-row">
            <MiniKpi label="Total Reports" value={saReports.length} />
            <MiniKpi label="Resolved" value={saResolvedCount} />
            <MiniKpi label="Needs Attention" value={saAttentionCount} />
          </div>
          <div className="chart-row">
            <div className="chart-col">
              <div className="chart-title">Monthly Report Volume</div>
              <BarTrendChart data={saSeries} color="var(--accent-2-dark)" />
            </div>
            <div className="chart-col donut-col">
              <div className="chart-title">Status Breakdown</div>
              <DonutChart data={saStatusData} />
              <Legend data={saStatusData} />
            </div>
          </div>
        </SectionPanel>
      </div>

      <div className="card recent-card">
        <div className="card-header">Recent Activity</div>
        {recent.length === 0 && <div className="recent-row" style={{ justifyContent: 'center', color: 'var(--text-faint)' }}>No activity yet.</div>}
        {recent.map(r => (
          <div className="recent-row" key={r.kind + '-' + r.id}>
            <span className={"recent-tag " + r.kind}>PC</span>
            <span className="recent-dept">{r.department}</span>
            <span className="recent-problem">{r.problem}</span>
            <StatusBadge status={r.status} />
            <span className="recent-date">{formatDate(r.dateReported)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* =========================================================

function ReportFormModal({ record, departmentOptions, onClose, onSave, titleLabel }) {
  const [form, setForm] = useState(() => record ? { ...record } : {

    onSave({ ...form, id: record ? record.id : null });

  return (
    <Modal title={(record ? 'Edit ' : 'Add ') + titleLabel} onClose={onClose} maxWidth="700px">

        <Field label="Status" required>
          <select className="select" style={{ width: '100%' }} value={form.status} onChange={e => update('status', e.target.value)}>
            {REPORT_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </Field>
        <Field label="Problem" full required>
          <textarea className="textarea" rows="2" value={form.problem} onChange={e => update('problem', e.target.value)} placeholder="Describe the reported issue" required />

        <Field label="Serial (Replacement)"><input className="input mono" style={{ width: '100%' }} value={form.serialReplacement} onChange={e => update('serialReplacement', e.target.value)} placeholder="e.g. RAM-SN-12345" /></Field>

/* =========================================================
   REPORTS PAGE (shared: PC Reports & Selling Area Reports)
   ========================================================= */
const REPORT_COLUMNS = [
  ['dateReported', 'Date Reported'], ['department', 'Department'], ['problem', 'Problem'],
  ['actionTaken', 'Action Taken'], ['replacement', 'Replacement'], ['serialReplacement', 'Serial No.'],
  ['status', 'Status'], ['remarks', 'Remarks'], ['technician', 'Technician'],
];

function ReportsPage({ titleLabel, idPrefix, data, setData, departmentOptions, addToast, query, setQuery }) {
  const [deptFilter, setDeptFilter] = useState('All');
  const [statusFilter, setStatusFilter] = useState('All');
  const [sortKey, setSortKey] = useState('dateReported');
  const [sortDir, setSortDir] = useState('desc');
  const [page, setPage] = useState(1);
  const pageSize = 8;
  const [modalOpen, setModalOpen] = useState(false);
  const [editingRecord, setEditingRecord] = useState(null);
  const [confirmState, setConfirmState] = useState(null);

  const filtered = useMemo(() => {
    let rows = data.filter(r => {
      const q = query.trim().toLowerCase();
      const matchesQuery = !q || [r.problem, r.actionTaken, r.remarks, r.department, r.technician, r.replacement].join(' ').toLowerCase().includes(q);
      const matchesDept = deptFilter === 'All' || r.department === deptFilter;
      const matchesStatus = statusFilter === 'All' || r.status === statusFilter;
      return matchesQuery && matchesDept && matchesStatus;
    });
    rows = rows.slice().sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === 'dateReported') { av = new Date(av).getTime(); bv = new Date(bv).getTime(); }
      else { av = (av || '').toString().toLowerCase(); bv = (bv || '').toString().toLowerCase(); }
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    return rows;
  }, [data, query, deptFilter, statusFilter, sortKey, sortDir]);

  useEffect(() => { setPage(1); }, [query, deptFilter, statusFilter]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const pageRows = filtered.slice((page - 1) * pageSize, page * pageSize);

  function toggleSort(key) {
    if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(key); setSortDir('asc'); }
  }
  function openAdd() { setEditingRecord(null); setModalOpen(true); }
  function openEdit(r) { setEditingRecord(r); setModalOpen(true); }
  function handleSave(record) {
    if (record.id) {
      setData(prev => prev.map(r => r.id === record.id ? record : r));
      addToast('Report updated successfully', 'success');
    } else {
      setData(prev => [{ ...record, id: nextId(idPrefix) }, ...prev]);
      addToast('Report added successfully', 'success');
    }
    setModalOpen(false);
  }
  function handleDeleteConfirmed() {
    setData(prev => prev.filter(r => r.id !== confirmState.id));
    addToast('Report deleted', 'danger');
    setConfirmState(null);
  }

  return (
    <div>
      <div className="toolbar">
        <select className="select" value={deptFilter} onChange={e => setDeptFilter(e.target.value)}>
          <option value="All">All Departments</option>
          {departmentOptions.map(d => <option key={d} value={d}>{d}</option>)}
        </select>
        <select className="select" value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
          <option value="All">All Status</option>
          {REPORT_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <div style={{ flex: 1 }} />
        <button className="btn btn-primary" onClick={openAdd}><Icon name="plus" size={15} /> Add Report</button>
      </div>
      <div className="card table-card">
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                {REPORT_COLUMNS.map(([key, label]) => (
                  <SortableTh key={key} label={label} sortKey={key} currentKey={sortKey} dir={sortDir} onSort={toggleSort} />
                ))}
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {pageRows.length === 0 && <tr><td colSpan={REPORT_COLUMNS.length + 1} className="empty-row"><div className="empty-state"><span className="empty-ic"><Icon name="search" size={16} /></span>No reports match your search or filters.</div></td></tr>}
              {pageRows.map(r => (
                <tr key={r.id}>
                  <td className="mono">{formatDate(r.dateReported)}</td>
                  <td>{r.department}</td>
                  <td className="truncate" title={r.problem}>{r.problem}</td>
                  <td className="truncate" title={r.actionTaken}>{r.actionTaken}</td>
                  <td className="truncate" title={r.replacement}>{r.replacement}</td>
                  <td className="mono">{r.serialReplacement}</td>
                  <td><StatusBadge status={r.status} /></td>
                  <td className="truncate" title={r.remarks}>{r.remarks}</td>
                  <td>{r.technician}</td>
                  <td>
                    <div className="row-actions">
                      <button className="icon-btn" title="Edit" onClick={() => openEdit(r)}><Icon name="edit" size={14} /></button>
                      <button className="icon-btn danger" title="Delete" onClick={() => setConfirmState(r)}><Icon name="trash" size={14} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <Pagination page={page} totalPages={totalPages} onChange={setPage} total={filtered.length} pageSize={pageSize} />
      </div>
      {modalOpen && <ReportFormModal record={editingRecord} departmentOptions={departmentOptions} onClose={() => setModalOpen(false)} onSave={handleSave} titleLabel={titleLabel} />}
      {confirmState && (
        <ConfirmDialog
          message={`Delete this ${titleLabel.toLowerCase()} for "${confirmState.department}" dated ${formatDate(confirmState.dateReported)}? This action cannot be undone.`}
          onCancel={() => setConfirmState(null)}
          onConfirm={handleDeleteConfirmed}
        />
      )}
    </div>
  );
}

function PcMonitoringPage({ data, setData, addToast, query, setQuery }) {
  const [deptFilter, setDeptFilter] = useState('All');
  const [deviceTypeFilter, setDeviceTypeFilter] = useState('All');
  const [statusFilter, setStatusFilter] = useState('All');
  const [sortKey, setSortKey] = useState('pcName');
  const [sortDir, setSortDir] = useState('asc');
  const [page, setPage] = useState(1);
  const pageSize = 8;
  const [modalOpen, setModalOpen] = useState(false);
  const [editingRecord, setEditingRecord] = useState(null);
  const [confirmState, setConfirmState] = useState(null);

  const filtered = useMemo(() => {
    let rows = data.filter(r => {
      const q = query.trim().toLowerCase();
      const matches = !q || r.pcName.toLowerCase().includes(q) || r.ipAddress.toLowerCase().includes(q) || r.department.toLowerCase().includes(q) || r.macAddress.toLowerCase().includes(q) || (r.user || '').toLowerCase().includes(q);
      const md = deptFilter === 'All' || r.department === deptFilter;
      const mdt = deviceTypeFilter === 'All' || r.deviceType === deviceTypeFilter;
      const ms = statusFilter === 'All' || r.status === statusFilter;
      return matches && md && mdt && ms;
    });
    rows = rows.slice().sort((a, b) => {
      let av = (a[sortKey] || '').toString().toLowerCase(), bv = (b[sortKey] || '').toString().toLowerCase();
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    return rows;
  }, [data, query, deptFilter, deviceTypeFilter, statusFilter, sortKey, sortDir]);

  useEffect(() => { setPage(1); }, [query, deptFilter, deviceTypeFilter, statusFilter]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const pageRows = filtered.slice((page - 1) * pageSize, page * pageSize);

  function toggleSort(key) {
    if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(key); setSortDir('asc'); }
  }
  function openAdd() { setEditingRecord(null); setModalOpen(true); }
  function openEdit(r) { setEditingRecord(r); setModalOpen(true); }
  function handleSave(record) {
    if (record.id) {
      setData(prev => prev.map(r => r.id === record.id ? record : r));
      addToast('PC record updated successfully', 'success');
    } else {
      setData(prev => [{ ...record, id: nextId('PCM') }, ...prev]);
      addToast('PC record added successfully', 'success');
    }
    setModalOpen(false);
  }
  function handleDeleteConfirmed() {
    setData(prev => prev.filter(r => r.id !== confirmState.id));
    addToast('PC record deleted', 'danger');
    setConfirmState(null);
  }

  return (
    <div>
      <div className="toolbar">
        <select className="select" value={deptFilter} onChange={e => setDeptFilter(e.target.value)}>
          <option value="All">All Departments</option>
          {DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}
        </select>
        <select className="select" value={deviceTypeFilter} onChange={e => setDeviceTypeFilter(e.target.value)}>
          <option value="All">All Device Types</option>
          {DEVICE_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
        </select>
        <select className="select" value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
          <option value="All">All Status</option>
          {PC_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <div style={{ flex: 1 }} />
        <button className="btn btn-primary" onClick={openAdd}><Icon name="plus" size={15} /> Add PC Record</button>
      </div>
      <div className="card table-card">
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <SortableTh label="Department" sortKey="department" currentKey={sortKey} dir={sortDir} onSort={toggleSort} />
                <SortableTh label="Device Type" sortKey="deviceType" currentKey={sortKey} dir={sortDir} onSort={toggleSort} />
                <SortableTh label="PC Name" sortKey="pcName" currentKey={sortKey} dir={sortDir} onSort={toggleSort} />
                <th>User</th>
                <SortableTh label="IP Address" sortKey="ipAddress" currentKey={sortKey} dir={sortDir} onSort={toggleSort} />
                <th>MAC Address</th>
                <th>Windows Version</th>
                <th>Motherboard</th>
                <th>RAM</th>
                <th>Storage</th>
                <th>Printer</th>
                <th>Monitor</th>
                <th>Scanner</th>
                <th>Processor</th>
                <th>GPU</th>
                <th>Projector</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {pageRows.length === 0 && <tr><td colSpan="17" className="empty-row"><div className="empty-state"><span className="empty-ic"><Icon name="search" size={16} /></span>No PCs match your search or filters.</div></td></tr>}
              {pageRows.map(r => (
                <tr key={r.id}>
                  <td>{r.department}</td>
                  <td>{r.deviceType || '-'}</td>
                  <td style={{ fontWeight: 600 }}>{r.pcName}</td>
                  <td>{r.user || '-'}</td>
                  <td className="mono">{r.ipAddress}</td>
                  <td className="mono truncate-sm" title={r.macAddress}>{r.macAddress}</td>
                  <td>{r.windowsVersion}</td>
                  <td>
                    <div>{r.motherboardModel}</div>
                    <div className="cell-sub mono">{r.motherboardSN}</div>
                  </td>
                  <td>
                    <div>{r.ramModel}</div>
                    <div className="cell-sub mono">{r.ramSN}</div>
                  </td>
                  <td>
                    <div>{r.storageModel} &middot; {r.storageType}</div>
                  </td>
                  <td>
                    <div>{r.printerModel}</div>
                    <div className="cell-sub mono">{r.printer}</div>
                  </td>
                  <td>
                    <div>{r.monitorModel}</div>
                    <div className="cell-sub mono">{r.monitor}</div>
                  </td>
                  <td>
                    <div>{r.scannerModel}</div>
                    <div className="cell-sub mono">{r.scannerSN}</div>
                  </td>
                  <td>{r.processor}</td>
                  <td>{r.gpu}</td>
                  <td>{r.projector}</td>
                  <td><StatusBadge status={r.status} /></td>
                  <td>
                    <div className="row-actions">
                      <button className="icon-btn" title="View / Edit" onClick={() => openEdit(r)}><Icon name="edit" size={14} /></button>
                      <button className="icon-btn danger" title="Delete" onClick={() => setConfirmState(r)}><Icon name="trash" size={14} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <Pagination page={page} totalPages={totalPages} onChange={setPage} total={filtered.length} pageSize={pageSize} />
      </div>
      {modalOpen && <PcFormModal record={editingRecord} onClose={() => setModalOpen(false)} onSave={handleSave} />}
      {confirmState && (
        <ConfirmDialog
          message={`Delete PC record "${confirmState.pcName}" (${confirmState.ipAddress})? This action cannot be undone.`}
          onCancel={() => setConfirmState(null)}
          onConfirm={handleDeleteConfirmed}
        />
      )}
    </div>
  );
}

function PosFormModal({ record, onClose, onSave, defaultSection }) {

        </div>
      </form>
    </Modal>
  );

function PosMonitoringPage({ data, setData, addToast, query, setQuery }) {
  const [activeSection, setActiveSection] = useState(POS_SECTIONS[0]);
  const [statusFilter, setStatusFilter] = useState('All');
  const [sortKey, setSortKey] = useState('counter');
  const [sortDir, setSortDir] = useState('asc');
  const [page, setPage] = useState(1);
  const pageSize = 8;
  const [modalOpen, setModalOpen] = useState(false);
  const [editingRecord, setEditingRecord] = useState(null);
  const [confirmState, setConfirmState] = useState(null);

  const sectionCounts = useMemo(() => {
    const m = {};
    POS_SECTIONS.forEach(s => { m[s] = 0; });
    data.forEach(r => { if (m[r.section] !== undefined) m[r.section] += 1; });
    return m;
  }, [data]);

  const filtered = useMemo(() => {
    let rows = data.filter(r => r.section === activeSection);
    rows = rows.filter(r => {
      const q = query.trim().toLowerCase();
      const matches = !q || [r.counter, r.terminal, r.serial, r.display1, r.display2, r.printerSerial, r.scannerSerial, r.flatbedSerial, r.ghlSerial].join(' ').toLowerCase().includes(q);
      const ms = statusFilter === 'All' || r.status === statusFilter;
      return matches && ms;
    });
    rows = rows.slice().sort((a, b) => {
      let av = (a[sortKey] || '').toString().toLowerCase(), bv = (b[sortKey] || '').toString().toLowerCase();
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    return rows;
  }, [data, activeSection, query, statusFilter, sortKey, sortDir]);

  useEffect(() => { setPage(1); }, [query, statusFilter, activeSection]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const pageRows = filtered.slice((page - 1) * pageSize, page * pageSize);

  function toggleSort(key) {
    if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(key); setSortDir('asc'); }
  }
  function openAdd() { setEditingRecord(null); setModalOpen(true); }
  function openEdit(r) { setEditingRecord(r); setModalOpen(true); }
  function handleSave(record) {
    if (record.id) {
      setData(prev => prev.map(r => r.id === record.id ? record : r));
      addToast('POS terminal updated successfully', 'success');
    } else {
      setData(prev => [{ ...record, id: nextId('POS') }, ...prev]);
      addToast('POS terminal added successfully', 'success');
    }
    setModalOpen(false);
  }
  function handleDeleteConfirmed() {
    setData(prev => prev.filter(r => r.id !== confirmState.id));
    addToast('POS terminal deleted', 'danger');
    setConfirmState(null);
  }

  return (
    <div>
      <div className="loc-tabs">
        {POS_SECTIONS.map(s => (
          <button key={s} className={"loc-tab" + (activeSection === s ? " active" : "")} onClick={() => setActiveSection(s)}>
            {s}
            <span className="loc-count">{sectionCounts[s] || 0}</span>
          </button>
        ))}
      </div>
      <div className="toolbar">
        <select className="select" value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
          <option value="All">All Status</option>
          {POS_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <div style={{ flex: 1 }} />
        <button className="btn btn-primary" onClick={openAdd}><Icon name="plus" size={15} /> Add POS Terminal</button>
      </div>
      <div className="card table-card">
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <SortableTh label="Counter" sortKey="counter" currentKey={sortKey} dir={sortDir} onSort={toggleSort} />
                <SortableTh label="Terminal" sortKey="terminal" currentKey={sortKey} dir={sortDir} onSort={toggleSort} />
                <th>Serial</th>
                <th>1st Display</th>
                <th>2nd Display</th>
                <th>Printer Serial</th>
                <th>Handheld Scanner Serial</th>
                <th>{flatbedFieldLabel(activeSection)}</th>
                <th>GHL Terminal Serial</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {pageRows.length === 0 && <tr><td colSpan="11" className="empty-row"><div className="empty-state"><span className="empty-ic"><Icon name="search" size={16} /></span>No POS terminals match your search or filters for {activeSection}.</div></td></tr>}
              {pageRows.map(r => (
                <tr key={r.id}>
                  <td style={{ fontWeight: 600 }}>{r.counter}</td>
                  <td>{r.terminal}</td>
                  <td className="mono truncate-sm" title={r.serial}>{r.serial}</td>
                  <td className="mono truncate-sm" title={r.display1}>{r.display1}</td>
                  <td className="mono truncate-sm" title={r.display2}>{r.display2}</td>
                  <td className="mono truncate-sm" title={r.printerSerial}>{r.printerSerial}</td>
                  <td className="mono truncate-sm" title={r.scannerSerial}>{r.scannerSerial}</td>
                  <td className="mono truncate-sm" title={r.flatbedSerial}>{r.flatbedSerial}</td>
                  <td className="mono truncate-sm" title={r.ghlSerial}>{r.ghlSerial}</td>
                  <td><StatusBadge status={r.status} /></td>
                  <td>
                    <div className="row-actions">
                      <button className="icon-btn" title="Edit" onClick={() => openEdit(r)}><Icon name="edit" size={14} /></button>
                      <button className="icon-btn danger" title="Delete" onClick={() => setConfirmState(r)}><Icon name="trash" size={14} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <Pagination page={page} totalPages={totalPages} onChange={setPage} total={filtered.length} pageSize={pageSize} />
      </div>
      {modalOpen && <PosFormModal record={editingRecord} defaultSection={activeSection} onClose={() => setModalOpen(false)} onSave={handleSave} />}
      {confirmState && (
        <ConfirmDialog
          message={`Delete POS terminal "${confirmState.terminal}" at ${confirmState.counter}? This action cannot be undone.`}
          onCancel={() => setConfirmState(null)}
          onConfirm={handleDeleteConfirmed}
        />
      )}
    </div>
  );
}

function SaReportsPage({ data, setData, departmentOptions, addToast, query, setQuery }) {
  const [deptFilter, setDeptFilter] = useState(() => departmentOptions[0] || 'All');
  const [statusFilter, setStatusFilter] = useState('All');
  const [sortKey, setSortKey] = useState('date');
  const [sortDir, setSortDir] = useState('desc');
  const [page, setPage] = useState(1);
  const pageSize = 8;
  const [modalOpen, setModalOpen] = useState(false);
  const [editingRecord, setEditingRecord] = useState(null);
  const [confirmState, setConfirmState] = useState(null);

  const filtered = useMemo(() => {
    let rows = data.filter(r => {
      const q = query.trim().toLowerCase();
      const matches = !q || [r.counter, r.terminal, r.issueType, r.problemDescription, r.troubleshootingSteps, r.technician].join(' ').toLowerCase().includes(q);
      const md = deptFilter === 'All' || r.supermarket === deptFilter;
      const ms = statusFilter === 'All' || r.status === statusFilter;
      return matches && md && ms;
    });
    rows = rows.slice().sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === 'date' || sortKey === 'dateResolved') { av = av ? new Date(av).getTime() : 0; bv = bv ? new Date(bv).getTime() : 0; }
      else { av = (av || '').toString().toLowerCase(); bv = (bv || '').toString().toLowerCase(); }
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    return rows;
  }, [data, query, deptFilter, statusFilter, sortKey, sortDir]);

  useEffect(() => { setPage(1); }, [query, deptFilter, statusFilter]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const pageRows = filtered.slice((page - 1) * pageSize, page * pageSize);

  function toggleSort(key) {
    if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(key); setSortDir('asc'); }
  }
  function openAdd() { setEditingRecord(null); setModalOpen(true); }
  function openEdit(r) { setEditingRecord(r); setModalOpen(true); }
  function handleSave(record) {
    if (record.id) {
      setData(prev => prev.map(r => r.id === record.id ? record : r));
      addToast('Report updated successfully', 'success');
    } else {
      setData(prev => [{ ...record, id: nextId('SAR') }, ...prev]);
      addToast('Report added successfully', 'success');
    }
    setModalOpen(false);
  }
  function handleDeleteConfirmed() {
    setData(prev => prev.filter(r => r.id !== confirmState.id));
    addToast('Report deleted', 'danger');
    setConfirmState(null);
  }

  return (
    <div>
      <div className="toolbar">
        <select className="select" value={deptFilter} onChange={e => setDeptFilter(e.target.value)}>
          {departmentOptions.map(d => <option key={d} value={d}>{d}</option>)}
        </select>
        <select className="select" value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
          <option value="All">All Status</option>
          {REPORT_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <div style={{ flex: 1 }} />
        <button className="btn btn-primary" onClick={openAdd}><Icon name="plus" size={15} /> Add Report</button>
      </div>
      <div className="card table-card">
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                {SA_REPORT_COLUMNS.map(([key, label]) => (
                  <SortableTh key={key} label={label} sortKey={key} currentKey={sortKey} dir={sortDir} onSort={toggleSort} />
                ))}
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {pageRows.length === 0 && <tr><td colSpan={SA_REPORT_COLUMNS.length + 1} className="empty-row"><div className="empty-state"><span className="empty-ic"><Icon name="search" size={16} /></span>No reports match your search or filters.</div></td></tr>}
              {pageRows.map(r => (
                <tr key={r.id}>
                  <td className="mono">{formatDate(r.date)}</td>
                  <td>{r.supermarket}</td>
                  <td style={{ fontWeight: 600 }}>{r.counter}</td>
                  <td>{r.terminal}</td>
                  <td>{r.issueType}</td>
                  <td className="truncate" title={r.problemDescription}>{r.problemDescription}</td>
                  <td className="truncate" title={r.troubleshootingSteps}>{r.troubleshootingSteps || '-'}</td>
                  <td><StatusBadge status={r.status} /></td>
                  <td>{r.technician}</td>
                  <td className="mono">{r.dateResolved ? formatDate(r.dateResolved) : '-'}</td>
                  <td>
                    <div className="row-actions">
                      <button className="icon-btn" title="Edit" onClick={() => openEdit(r)}><Icon name="edit" size={14} /></button>
                      <button className="icon-btn danger" title="Delete" onClick={() => setConfirmState(r)}><Icon name="trash" size={14} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <Pagination page={page} totalPages={totalPages} onChange={setPage} total={filtered.length} pageSize={pageSize} />
      </div>
      {modalOpen && <SaReportFormModal record={editingRecord} departmentOptions={departmentOptions} onClose={() => setModalOpen(false)} onSave={handleSave} />}
      {confirmState && (
        <ConfirmDialog
          message={`Delete report for "${confirmState.terminal}" at ${confirmState.counter}? This action cannot be undone.`}
          onCancel={() => setConfirmState(null)}
          onConfirm={handleDeleteConfirmed}
        />
      )}
    </div>
  );
}

const GHL_COLUMNS = [
  ['dateReported', 'Date Reported'], ['section', 'Section'], ['counter', 'Counter'], ['type', 'Type'], ['sn', 'SN'],
  ['reportCount', 'Report Count'], ['requestNumber', 'Request Number'], ['dateReceived', 'Date Received'], ['status', 'Status'],
];

function GhlReportFormModal({ record, terminals, onClose, onSave }) {
  const [form, setForm] = useState(() => record ? { ...record } : {
    dateReported: new Date().toISOString().slice(0, 10), section: SELLING_AREAS[0], counter: '', type: GHL_TYPES[0], sn: '',
    reportCount: 1, requestNumber: '', dateReceived: '', status: 'Pending',
  });
  const [snAuto, setSnAuto] = useState(true);
  const counterOptions = useMemo(() => {
    const seen = new Set();
    return terminals.map(t => t.ctr).filter(c => c && !seen.has(c) && seen.add(c)).sort();
  }, [terminals]);
  function update(k, v) { setForm(f => ({ ...f, [k]: v })); }
  function updateCounter(ctr) {
    const match = terminals.find(t => t.ctr === ctr);
    setForm(f => ({ ...f, counter: ctr, sn: (snAuto && match) ? match.serialNumber : f.sn }));
  }
  function updateSn(v) { setSnAuto(false); update('sn', v); }
  function submit(e) {
    e.preventDefault();
    if (!form.counter.trim() || !form.dateReported) return;
    onSave({ ...form, reportCount: Number(form.reportCount) || 0, id: record ? record.id : null });
  }
  return (
    <Modal title={record ? 'Edit GHL Report' : 'Add GHL Report'} onClose={onClose} maxWidth="700px">
      <form onSubmit={submit} className="form-grid">
        <Field label="Date Reported" required><input type="date" className="input" value={form.dateReported} onChange={e => update('dateReported', e.target.value)} required /></Field>
        <Field label="Section" required>
          <select className="select" style={{ width: '100%' }} value={form.section} onChange={e => update('section', e.target.value)}>
            {SELLING_AREAS.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </Field>
        <Field label="Counter" required>
          {counterOptions.length > 0 ? (
            <select className="select" style={{ width: '100%' }} value={form.counter} onChange={e => updateCounter(e.target.value)} required>
              <option value="" disabled>Select counter...</option>
              {counterOptions.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          ) : (
            <input className="input" style={{ width: '100%' }} value={form.counter} onChange={e => update('counter', e.target.value)} placeholder="e.g. CTR-01" required />
          )}
        </Field>
        <Field label="Type" required>
          <select className="select" style={{ width: '100%' }} value={form.type} onChange={e => update('type', e.target.value)}>
            {GHL_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
        </Field>
        <Field label="SN">
          <input className="input mono" style={{ width: '100%' }} value={form.sn} onChange={e => updateSn(e.target.value)} placeholder="Auto-filled from Terminal, or type manually" />
          <span className="cell-sub">Auto-filled from the Terminal list based on the selected Counter. You can still edit it.</span>
        </Field>
        <Field label="Report Count" required><input type="number" min="0" className="input" style={{ width: '100%' }} value={form.reportCount} onChange={e => update('reportCount', e.target.value)} required /></Field>
        <Field label="Request Number"><input className="input mono" style={{ width: '100%' }} value={form.requestNumber} onChange={e => update('requestNumber', e.target.value)} placeholder="e.g. REQ-20260814-01" /></Field>
        <Field label="Date Received"><input type="date" className="input" style={{ width: '100%' }} value={form.dateReceived} onChange={e => update('dateReceived', e.target.value)} /></Field>
        <Field label="Status" required>
          <select className="select" style={{ width: '100%' }} value={form.status} onChange={e => update('status', e.target.value)}>
            {GHL_REPORT_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </Field>
        <div className="form-actions">
          <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
          <button type="submit" className="btn btn-primary"><Icon name="check" size={15} /> {record ? 'Save Changes' : 'Add Report'}</button>
        </div>
      </form>
    </Modal>
  );
}
