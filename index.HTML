        <Field label="Quantity" required><input type="number" min="0" step="1" className="input" style={{ width: '100%' }} value={form.quantity} onChange={e => update('quantity', e.target.value)} required /></Field>
        <Field label="Item Name" full required><input className="input" style={{ width: '100%' }} value={form.itemName} onChange={e => update('itemName', e.target.value)} placeholder="e.g. Bond Paper A4" required /></Field>
        <Field label="Remarks" full><textarea className="textarea" rows="3" style={{ width: '100%' }} value={form.remarks} onChange={e => update('remarks', e.target.value)} placeholder="Optional notes..." /></Field>
        <div className="form-actions">
          <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
          <button type="submit" className="btn btn-primary"><Icon name="check" size={15} /> {record ? 'Save Changes' : 'Add Item'}</button>
        </div>
      </form>
    </Modal>
  );
}

function InventoryPage({ data, setData, addToast, query, setQuery, activeLoc, setActiveLoc }) {
  const [sortKey, setSortKey] = useState('date');
  const [sortDir, setSortDir] = useState('desc');
  const [page, setPage] = useState(1);
  const pageSize = 8;
  const [modalOpen, setModalOpen] = useState(false);
  const [editingRecord, setEditingRecord] = useState(null);
  const [confirmState, setConfirmState] = useState(null);

  const locCounts = useMemo(() => {
    const m = {};
    INVENTORY_LOCATIONS.forEach(l => { m[l] = 0; });
    data.forEach(r => { if (m[r.location] !== undefined) m[r.location] += 1; });
    return m;
  }, [data]);

  const filtered = useMemo(() => {
    let rows = data.filter(r => r.location === activeLoc);
    const q = query.trim().toLowerCase();
    if (q) rows = rows.filter(r => [r.itemName, r.remarks].join(' ').toLowerCase().includes(q));
    rows = rows.slice().sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === 'quantity') { av = Number(a.quantity) || 0; bv = Number(b.quantity) || 0; }
      else { av = (av || '').toString().toLowerCase(); bv = (bv || '').toString().toLowerCase(); }
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    return rows;
  }, [data, activeLoc, query, sortKey, sortDir]);

  useEffect(() => { setPage(1); }, [query, activeLoc]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const pageRows = filtered.slice((page - 1) * pageSize, page * pageSize);
  const totalQty = filtered.reduce((sum, r) => sum + (Number(r.quantity) || 0), 0);

  function toggleSort(key) {
    if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(key); setSortDir('asc'); }
  }
  function openAdd() { setEditingRecord(null); setModalOpen(true); }
  function openEdit(r) { setEditingRecord(r); setModalOpen(true); }
  function handleSave(record) {
    if (record.id) {
      setData(prev => prev.map(r => r.id === record.id ? record : r));
      addToast('Inventory item updated successfully', 'success');
    } else {
      setData(prev => [{ ...record, id: nextId('INV'), location: activeLoc }, ...prev]);
      addToast('Inventory item added successfully', 'success');
    }
    setModalOpen(false);
  }
  function handleDeleteConfirmed() {
    setData(prev => prev.filter(r => r.id !== confirmState.id));
    addToast('Inventory item deleted', 'danger');
    setConfirmState(null);
  }

  return (
    <div>
      <div className="loc-tabs">
        {INVENTORY_LOCATIONS.map(loc => (
          <button key={loc} className={"loc-tab" + (activeLoc === loc ? " active" : "")} onClick={() => setActiveLoc(loc)}>
            {loc}
            <span className="loc-count">{locCounts[loc] || 0}</span>
          </button>
        ))}
      </div>
      <div className="toolbar">
        <div style={{ fontSize: '13px', color: 'var(--text-muted)', fontWeight: 600 }}>
          {activeLoc} &middot; <span className="mono">{filtered.length}</span> item{filtered.length === 1 ? '' : 's'} &middot; <span className="mono">{totalQty}</span> total qty
        </div>
        <div style={{ flex: 1 }} />
        <button className="btn btn-primary" onClick={openAdd}><Icon name="plus" size={15} /> Add Item</button>
      </div>
      <div className="card table-card">
        <div className="table-wrap">
          <table className="table-compact">
            <thead>
              <tr>
                <SortableTh label="Date" sortKey="date" currentKey={sortKey} dir={sortDir} onSort={toggleSort} />
                <SortableTh label="Item Name" sortKey="itemName" currentKey={sortKey} dir={sortDir} onSort={toggleSort} />
                <SortableTh label="Quantity" sortKey="quantity" currentKey={sortKey} dir={sortDir} onSort={toggleSort} />
                <th>Remarks</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {pageRows.length === 0 && <tr><td colSpan="5" className="empty-row"><div className="empty-state"><span className="empty-ic"><Icon name="search" size={16} /></span>No inventory items found for {activeLoc}.</div></td></tr>}
              {pageRows.map(r => (
                <tr key={r.id}>
                  <td className="mono">{formatDate(r.date)}</td>
                  <td style={{ fontWeight: 600 }}>{r.itemName}</td>
                  <td className="mono">{r.quantity}</td>
                  <td className="truncate" title={r.remarks}>{r.remarks || '-'}</td>
                  <td>
                    <div className="row-actions">
                      <button className="icon-btn" title="Edit" onClick={() => openEdit(r)}><Icon name="edit" size={14} /></button>
                      <button className="icon-btn danger" title="Delete" onClick={() => setConfirmState(r)}><Icon name="trash" size={14} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <Pagination page={page} totalPages={totalPages} onChange={setPage} total={filtered.length} pageSize={pageSize} />
      </div>
      {modalOpen && <InventoryFormModal record={editingRecord} location={activeLoc} onClose={() => setModalOpen(false)} onSave={handleSave} />}
      {confirmState && (
        <ConfirmDialog
          message={`Delete inventory item "${confirmState.itemName}" from ${confirmState.location}? This action cannot be undone.`}
          onCancel={() => setConfirmState(null)}
          onConfirm={handleDeleteConfirmed}
        />
      )}
    </div>
  );
}

          </select>
          <div className="meta" style={{ marginTop: '8px' }}>

        <div className="meta" style={{ marginTop: '10px' }}>ISS Department &middot; Internal Use Only</div>

/* =========================================================
   FIRESTORE SYNC HOOK
   Keeps a collection in sync in real-time across devices.
   Auto-seeds the collection with demo data on first run only.
   Exposes a setData(updater) that behaves like React's setState
   so existing page components (ReportsPage, PcMonitoringPage,
   PosMonitoringPage) don't need to change at all.
   ========================================================= */
function useFirestoreCollection(collectionName, seedData) {
  const [data, setDataState] = useState(seedData);
  const [ready, setReady] = useState(false);
  const [error, setError] = useState(null);
  const dataRef = useRef(seedData);
  useEffect(() => { dataRef.current = data; }, [data]);

  useEffect(() => {
    let unsub = () => {};
    let cancelled = false;

    // Safety net: never let the UI hang forever, even if Firestore never responds.
    const timeout = setTimeout(() => {
      if (!cancelled) {
        console.warn('Firestore (' + collectionName + ') took too long to respond. Showing local data instead.');
        setError('timeout');
        setReady(true);
      }
    }, 10000);

    (async () => {
      try {
        const snap = await db.collection(collectionName).get();
        if (!cancelled && snap.empty) {
          const batch = db.batch();
          seedData.forEach(item => batch.set(db.collection(collectionName).doc(item.id), item));
          await batch.commit();
        } else if (!cancelled && collectionName === 'posInventory' && snap.docs.some(d => !('section' in d.data()))) {
          // One-time migration: legacy POS Monitoring records (old CTR/Monitor Serial/BIR-MIN-TIN schema)
          // don't have a `section` field, so they no longer match the Department Store / Supermarket tabs.
          // Replace them with the current schema so counts and tables stay accurate.
          const delBatch = db.batch();
          snap.docs.forEach(d => delBatch.delete(d.ref));
          await delBatch.commit();
          const addBatch = db.batch();
          seedData.forEach(item => addBatch.set(db.collection(collectionName).doc(item.id), item));
          await addBatch.commit();
        }
        unsub = db.collection(collectionName).onSnapshot(
          snapshot => {
            const rows = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
            setDataState(rows);
            setError(null);
            setReady(true);
            clearTimeout(timeout);
          },
          err => {
            console.error('Firestore sync error (' + collectionName + '):', err);
            setError(err.code || err.message || 'sync-error');
            setReady(true);
            clearTimeout(timeout);
          }
        );
      } catch (err) {
        console.error('Firestore connection error (' + collectionName + '):', err);
        setError(err.code || err.message || 'connection-error');
        setReady(true);
        clearTimeout(timeout);
      }
    })();

    return () => { cancelled = true; clearTimeout(timeout); unsub(); };
  }, [collectionName]);

  function setData(updater) {
    const prev = dataRef.current;
    const next = typeof updater === 'function' ? updater(prev) : updater;
    const nextIds = new Set(next.map(r => r.id));
    prev.forEach(r => {
      if (!nextIds.has(r.id)) db.collection(collectionName).doc(r.id).delete().catch(err => console.error('Delete failed:', err));
    });
    next.forEach(r => {
      const old = prev.find(p => p.id === r.id);
      if (!old || JSON.stringify(old) !== JSON.stringify(r)) {
        db.collection(collectionName).doc(r.id).set(r).catch(err => console.error('Save failed:', err));
      }
    });
  }

  return [data, setData, ready, error];
}

/* =========================================================
   APP ROOT
   ========================================================= */
const PAGES_META = {
  dashboard: { title: 'Dashboard', subtitle: 'Monitoring overview across PC & Selling Area operations', icon: 'dashboard' },
  pcReports: { title: 'Back Office Reports', subtitle: 'Trouble reports for back-office & admin department computers', icon: 'pc' },
  saReports: { title: 'Selling Area Reports', subtitle: 'Trouble reports for supermarket & department store counters and terminals', icon: 'store' },
  pcMonitoring: { title: 'Back Office', subtitle: 'Full hardware & software inventory of all monitored PCs', icon: 'activity' },
  posMonitoring: { title: 'Selling Area', subtitle: 'Inventory and registration details of POS terminals', icon: 'pos' },
  ghlReports: { title: 'NTT Reports', subtitle: 'NTT card terminal trouble reports and terminal registry', icon: 'server' },
  inventory: { title: 'Inventory', subtitle: 'Stock records across Main Office, Second Room, Server, DS1-4, and Cabin', icon: 'box' },
};

function App() {
  const [page, setPage] = useState('dashboard');
  const [invLoc, setInvLoc] = useState(INVENTORY_LOCATIONS[0]);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [pcReports, setPcReports, pcReportsReady, pcReportsErr] = useFirestoreCollection('pcReports', SEED_PC_REPORTS);
  const [saReports, setSaReports, saReportsReady, saReportsErr] = useFirestoreCollection('saReports', SEED_SA_REPORTS);
  const [pcInventory, setPcInventory, pcInventoryReady, pcInventoryErr] = useFirestoreCollection('pcInventory', SEED_PC_INVENTORY);
  const [posInventory, setPosInventory, posInventoryReady, posInventoryErr] = useFirestoreCollection('posInventory', SEED_POS_INVENTORY);
  const [ghlReports, setGhlReports, ghlReportsReady, ghlReportsErr] = useFirestoreCollection('ghlReports', SEED_GHL_REPORTS);
  const [ghlTerminals, setGhlTerminals, ghlTerminalsReady, ghlTerminalsErr] = useFirestoreCollection('ghlTerminals', SEED_GHL_TERMINALS);
  const [inventory, setInventory, inventoryReady, inventoryErr] = useFirestoreCollection('inventory', SEED_INVENTORY);
  const allReady = pcReportsReady && saReportsReady && pcInventoryReady && posInventoryReady && ghlReportsReady && ghlTerminalsReady && inventoryReady;
  const connectionError = pcReportsErr || saReportsErr || pcInventoryErr || posInventoryErr || ghlReportsErr || ghlTerminalsErr || inventoryErr;
  const [toasts, setToasts] = useState([]);
  const [clock, setClock] = useState(new Date());
  const [backupBusy, setBackupBusy] = useState(false);
  const [autoBackupMinutes, setAutoBackupMinutes] = useState(0);
  const [backupFormat, setBackupFormat] = useState('pdf');
  const [lastBackupAt, setLastBackupAt] = useState(null);
  const errorBackupFiredRef = useRef(false);

  const [pcQuery, setPcQuery] = useState('');
  const [saQuery, setSaQuery] = useState('');
  const [pcInvQuery, setPcInvQuery] = useState('');
  const [posInvQuery, setPosInvQuery] = useState('');
  const [ghlQuery, setGhlQuery] = useState('');
  const [invQuery, setInvQuery] = useState('');

  useEffect(() => {
    const t = setInterval(() => setClock(new Date()), 30000);
    return () => clearInterval(t);
  }, []);

  function addToast(message, type = 'success') {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, message, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }

  function runBackup(silent, format) {
    const fmt = format || backupFormat;
    setBackupBusy(true);
    try {
      const collections = { pcReports, saReports, pcInventory, posInventory, ghlReports, ghlTerminals, inventory };
      const labels = [];
      if (fmt === 'pdf' || fmt === 'both') { generateBackupPdf(collections); labels.push('PDF'); }
      if (fmt === 'excel' || fmt === 'both') { generateBackupExcel(collections); labels.push('Excel'); }
      setLastBackupAt(new Date());
      const what = labels.join(' & ');
      addToast(silent ? `Auto-backup ${what} downloaded` : `Backup ${what} downloaded successfully`, 'success');
    } catch (err) {
      console.error('Backup failed:', err);
      addToast('Backup failed — a required library did not load. Check your internet connection.', 'danger');
    } finally {
      setBackupBusy(false);
    }
  }

  useEffect(() => {
    if (!autoBackupMinutes) return;
    const t = setInterval(() => runBackup(true), autoBackupMinutes * 60 * 1000);
    return () => clearInterval(t);
  }, [autoBackupMinutes, backupFormat, pcReports, saReports, pcInventory, posInventory, ghlReports, ghlTerminals, inventory]);

  useEffect(() => {
    if (connectionError && !errorBackupFiredRef.current && allReady) {
      errorBackupFiredRef.current = true;
      runBackup(true);
    }
  }, [connectionError, allReady]);

  const invLocCounts = useMemo(() => {
    const m = {};
    INVENTORY_LOCATIONS.forEach(l => { m[l] = 0; });
    inventory.forEach(r => { if (m[r.location] !== undefined) m[r.location] += 1; });
    return m;
  }, [inventory]);

  const currentPageMeta = page === 'inventory'
    ? { title: 'Inventory — ' + invLoc, subtitle: `Stock records for ${invLoc}`, icon: 'box' }
    : PAGES_META[page];

  let searchProps = { show: false, query: '', setQuery: () => {}, placeholder: '' };
  if (page === 'pcReports') searchProps = { show: true, query: pcQuery, setQuery: setPcQuery, placeholder: 'Search PC reports (problem, dept, technician)...' };
  if (page === 'saReports') searchProps = { show: true, query: saQuery, setQuery: setSaQuery, placeholder: 'Search by counter, terminal, issue, or technician...' };
  if (page === 'pcMonitoring') searchProps = { show: true, query: pcInvQuery, setQuery: setPcInvQuery, placeholder: 'Search by PC Name, IP Address, or Department...' };
  if (page === 'posMonitoring') searchProps = { show: true, query: posInvQuery, setQuery: setPosInvQuery, placeholder: 'Search POS terminals, counter, serials...' };
  if (page === 'ghlReports') searchProps = { show: true, query: ghlQuery, setQuery: setGhlQuery, placeholder: 'Search GHL reports (counter, type, SN, request #)...' };
  if (page === 'inventory') searchProps = { show: true, query: invQuery, setQuery: setInvQuery, placeholder: 'Search item name or remarks...' };

  if (!allReady) {
    return (
      <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: '10px', background: 'var(--canvas)' }}>
        <div className="status-pill" style={{ color: 'var(--accent-dark)' }}><span className="pulse"></span></div>
        <div style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: '12.5px', color: 'var(--text-muted)' }}>Connecting to database...</div>
      </div>
    );
  }

  return (
    <div className="app-shell">
      {connectionError && (
        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, zIndex: 300, background: 'var(--red)', color: '#fff', fontSize: '12.5px', textAlign: 'center', padding: '8px 14px' }}>
          Couldn't fully sync with the database (showing local data instead). Check your Firestore setup — see browser console (F12) for details.
        </div>
      )}
      <div className={"overlay" + (sidebarOpen ? " show" : "")} onClick={() => setSidebarOpen(false)}></div>
      <Sidebar
        active={page}
        activeLoc={invLoc}
        onSelect={(k) => {
          if (k.indexOf('inventory:') === 0) {
            setInvLoc(k.slice('inventory:'.length));
            setPage('inventory');
          } else {
            setPage(k);
          }
          setSidebarOpen(false);
        }}
        open={sidebarOpen}
        pcCount={pcInventory.length}
        posCount={posInventory.length}
        locCounts={invLocCounts}
        onBackupNow={() => runBackup(false)}
        backupBusy={backupBusy}
        autoBackupMinutes={autoBackupMinutes}
        onAutoBackupChange={(mins) => { setAutoBackupMinutes(mins); addToast(mins ? `Auto-backup enabled — every ${mins} min` : 'Auto-backup disabled', 'success'); }}
        lastBackupAt={lastBackupAt}
        backupFormat={backupFormat}
        onBackupFormatChange={setBackupFormat}
      />
      <div className="main">
        <Header
          current={currentPageMeta}
          onMenu={() => setSidebarOpen(o => !o)}
          clock={clock}
          query={searchProps.query}
          setQuery={searchProps.setQuery}
          searchPlaceholder={searchProps.placeholder}
          showSearch={searchProps.show}
        />
        <div className="ticker">
          <div className="ticker-track">
            <span className="tick-item"><span className="dot" style={{ background: 'var(--accent)' }}></span>{pcReports.length} PC Reports</span>
            <span className="tick-item"><span className="dot" style={{ background: 'var(--accent-2)' }}></span>{saReports.length} Selling Area Reports</span>
            <span className="tick-item"><span className="dot" style={{ background: '#7C3AED' }}></span>{pcInventory.length} System Unit Count</span>
            <span className="tick-item"><span className="dot" style={{ background: '#EA580C' }}></span>{posInventory.length} POS Count</span>
            <span className="tick-item"><span className="dot" style={{ background: '#0D9488' }}></span>{ghlReports.length} GHL Reports</span>
            <span className="tick-item"><span className="dot" style={{ background: '#DB2777' }}></span>{inventory.length} Inventory Items</span>
            <span className="tick-item muted">Last sync {clock.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</span>
            <span className="tick-item" aria-hidden="true"><span className="dot" style={{ background: 'var(--accent)' }}></span>{pcReports.length} PC Reports</span>
            <span className="tick-item" aria-hidden="true"><span className="dot" style={{ background: 'var(--accent-2)' }}></span>{saReports.length} Selling Area Reports</span>
            <span className="tick-item" aria-hidden="true"><span className="dot" style={{ background: '#7C3AED' }}></span>{pcInventory.length} System Unit Count</span>
            <span className="tick-item" aria-hidden="true"><span className="dot" style={{ background: '#EA580C' }}></span>{posInventory.length} POS Count</span>
            <span className="tick-item" aria-hidden="true"><span className="dot" style={{ background: '#0D9488' }}></span>{ghlReports.length} GHL Reports</span>
            <span className="tick-item" aria-hidden="true"><span className="dot" style={{ background: '#DB2777' }}></span>{inventory.length} Inventory Items</span>
            <span className="tick-item muted" aria-hidden="true">Last sync {clock.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</span>
          </div>
        </div>
        <div className="content">
          {page === 'dashboard' && <Dashboard pcReports={pcReports} saReports={saReports} pcInventory={pcInventory} posInventory={posInventory} />}
          {page === 'pcReports' && (
            <ReportsPage titleLabel="PC Report" idPrefix="PCR" data={pcReports} setData={setPcReports} departmentOptions={DEPARTMENTS} addToast={addToast} query={pcQuery} setQuery={setPcQuery} />
          )}
          {page === 'saReports' && (
            <SaReportsPage data={saReports} setData={setSaReports} departmentOptions={SELLING_AREAS} addToast={addToast} query={saQuery} setQuery={setSaQuery} />
          )}
          {page === 'pcMonitoring' && (
            <PcMonitoringPage data={pcInventory} setData={setPcInventory} addToast={addToast} query={pcInvQuery} setQuery={setPcInvQuery} />
          )}
          {page === 'posMonitoring' && (
            <PosMonitoringPage data={posInventory} setData={setPosInventory} addToast={addToast} query={posInvQuery} setQuery={setPosInvQuery} />
          )}
          {page === 'ghlReports' && (
            <GhlReportsPage data={ghlReports} setData={setGhlReports} terminals={ghlTerminals} setTerminals={setGhlTerminals} addToast={addToast} query={ghlQuery} setQuery={setGhlQuery} />
          )}
          {page === 'inventory' && (
            <InventoryPage data={inventory} setData={setInventory} addToast={addToast} query={invQuery} setQuery={setInvQuery} activeLoc={invLoc} setActiveLoc={setInvLoc} />
          )}
        </div>
      </div>
      <ToastContainer toasts={toasts} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
